<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pipes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pipes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<!--
  Pipes: connect each pair of dots with a pipe, without crossing, and fill the whole board.
  Fifty puzzles from 4×4 to 8×8, each with exactly one answer, baked into this file.
  One file on purpose; the typeface is embedded at the very end.
-->
<style>
:root{
  --bg:#000; --panel:#12151b; --ink:#fff; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.14); --fill:rgba(255,255,255,.1);
  --good:#34c759;
  --font:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.3 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums lining-nums}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));max-width:900px;margin:0 auto}
.bar{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;min-height:52px}
.bar h2{margin:0;font-size:20px;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h2 small{display:block;font-size:13px;font-weight:400;color:var(--dim);line-height:1.2}
.icon-btn{width:52px;height:52px;border-radius:26px;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:var(--fill)}
.icon-btn:disabled{opacity:.25}
#stage{position:relative;min-height:0;display:grid;place-items:center}
#board{position:relative;border-radius:18px;background:var(--panel);box-shadow:0 0 0 2px var(--line)}
canvas{display:block;width:100%;height:100%;border-radius:18px}
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 6px 2px;min-height:56px;font-size:15px;color:var(--dim)}
.foot .stat b{color:var(--ink);font-weight:500}
.pill{height:44px;padding:0 18px;border-radius:22px;background:var(--fill);display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);white-space:nowrap}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill:active{filter:brightness(1.3)}
.pill:disabled{opacity:.3}

/* ---------- the levels screen */
.levels{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 4px 20px;text-align:center}
.levels button{touch-action:pan-y}
.levels h1{margin:10px 0 2px;font-size:40px;font-weight:500;line-height:1.1}
.levels .sub{margin:0 auto 14px;max-width:360px;font-size:15px;color:var(--dim);text-wrap:balance}
.big{display:inline-grid;place-items:center;min-width:220px;height:56px;padding:0 34px;border-radius:28px;background:#fff;color:#000;font-size:19px;font-weight:500;margin:4px 0 16px}
.big:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:420px;margin:0 auto;padding:0 6px}
@media (min-width:640px){.grid{grid-template-columns:repeat(10,minmax(0,1fr));max-width:760px}}
.lv{position:relative;aspect-ratio:1;border-radius:14px;background:var(--fill);display:grid;place-items:center;font-size:19px;font-weight:500;color:var(--ink)}
.lv.done{background:rgba(52,199,89,.22);color:var(--good)}
.lv.done::after{content:'';position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:4px;background:var(--good)}
.lv.next{box-shadow:0 0 0 2px #fff inset}
.lv:active{filter:brightness(1.3)}
.sizes{display:flex;justify-content:center;gap:14px;margin:12px 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.small{font-size:14px;color:var(--dim);margin:10px 0 0}
.small button{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}

/* ---------- the screen on top of the board */
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.62);border-radius:18px;text-align:center;padding:20px}
.ov .box{display:grid;gap:14px;justify-items:center}
.ov h1{margin:0;font-size:34px;font-weight:500;line-height:1.1}
.ov p{margin:0;font-size:16px;color:var(--dim)}
.ov .big{margin:4px 0 0}
#confetti{position:absolute;inset:0;pointer-events:none;border-radius:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <p class="sub">Join each pair of dots with a pipe. Pipes can’t cross, and the whole board has to fill up.</p>
    <button type="button" class="big" id="go">${count ? (count >= LEVELS.length ? 'Play again from 1' : `Continue · level ${next + 1}`) : 'Play'}</button>
    <div class="sizes"><span>4×4</span><span>·</span><span>5×5</span><span>·</span><span>6×6</span><span>·</span><span>7×7</span><span>·</span><span>8×8</span></div>
    <div class="grid" role="list">${LEVELS.map((lv, i) => `<button type="button" class="lv num${done[i] ? ' done' : ''}${i === next ? ' next' : ''}" data-i="${i}" aria-label="Level ${i + 1}, ${lv.n} by ${lv.n}${done[i] ? ', done' : ''}">${i + 1}</button>`).join('')}</div>
    <p class="small">${count} of ${LEVELS.length} solved · Sound <button type="button" id="snd">${settings.sound ? 'on' : 'off'}</button>${isIOS() && !standalone() ? '<br>For the whole screen, tap Share, then Add to Home Screen.' : ''}</p>
  </div><div></div>`;
  $('#go').addEventListener('click', () => { unlockAudio(); play(count >= LEVELS.length ? 0 : next); });
  $('.grid').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { unlockAudio(); play(+b.dataset.i); } });
  $('#snd').addEventListener('click', e => { settings.sound = !settings.sound; LS.set('pipes.sound', settings.sound); e.target.textContent = settings.sound ? 'on' : 'off'; unlockAudio(); if (settings.sound) SND.tick(); });
}
function play(idx) { load(idx); screen = 'play'; render(); }
function renderPlay() {
  const lv = LEVELS[game.idx], last = game.idx === LEVELS.length - 1;
  app.innerHTML = `<header class="bar">
      <button type="button" class="icon-btn" id="back" aria-label="All levels">${ICON.grid}</button>
      <h2>Level ${game.idx + 1}<small>${lv.n}×${lv.n} · ${lv.pairs.length} colours</small></h2>
      <button type="button" class="icon-btn" id="clear" aria-label="Clear the board">${ICON.clear}</button>
    </header>
    <div id="stage"><div id="board"><canvas id="c" aria-label="The board"></canvas><canvas id="confetti"></canvas>${game.won ? `<div class="ov"><div class="box"><h1>${last ? 'All 50 done!' : 'Level complete!'}</h1><p>${game.moves} ${game.moves === 1 ? 'move' : 'moves'}${game.hints ? ` · ${game.hints} hint${game.hints > 1 ? 's' : ''}` : game.moves === lv.pairs.length ? ' · perfect' : ''}</p><button type="button" class="big" id="next">${last ? 'Back to the levels' : 'Next level'}</button></div></div>` : ''}</div></div>
    <div class="foot"><span class="stat num">Pipes <b>${joined()} of ${lv.pairs.length}</b> · Board <b>${Math.round(filled() / (lv.n * lv.n) * 100)}%</b> · Moves <b>${game.moves}</b></span><button type="button" class="pill" id="hint" ${game.won ? 'disabled' : ''}>${ICON.bulb}Hint</button></div>`;
  $('#back').addEventListener('click', () => { screen = 'levels'; render(); });
  $('#clear').addEventListener('click', () => { if (game.won) return; game.paths.forEach((_, i) => setPath(i, [])); game.moves = 0; game.drag = null; SND.cut(); render(); });
  $('#hint').addEventListener('click', () => { unlockAudio(); hint(); });
  if (game.won) $('#next').addEventListener('click', () => { if (last) { screen = 'levels'; render(); } else play(game.idx + 1); });
  fit(); draw(); wirePointer();
}

/* ================================================================== the board on canvas */
let cell = 0, bpx = 0;
function fit() {
  const stage = $('#stage'), board = $('#board'); if (!stage || !board) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  bpx = Math.max(100, Math.min(w, h) - 8); board.style.width = bpx + 'px'; board.style.height = bpx + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const c = $('#c'); c.width = Math.round(bpx * dpr); c.height = Math.round(bpx * dpr);
  cell = bpx / game.n;
}
const centre = ([r, c]) => [c * cell + cell / 2, r * cell + cell / 2];
function draw() {
  const c = $('#c'); if (!c) return;
  const ctx = c.getContext('2d'), dpr = c.width / bpx; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, bpx, bpx);
  for (let r = 0; r < game.n; r++) for (let cc = 0; cc < game.n; cc++) {
    const o = game.occ[r][cc];
    if (o >= 0) { ctx.fillStyle = COLORS[o % COLORS.length]; ctx.globalAlpha = .2; ctx.fillRect(cc * cell, r * cell, cell, cell); ctx.globalAlpha = 1; }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1;
  for (let i = 1; i < game.n; i++) { ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, bpx); ctx.moveTo(0, i * cell); ctx.lineTo(bpx, i * cell); ctx.stroke(); }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  game.paths.forEach((p, i) => {
    if (p.length < 2) return;
    ctx.strokeStyle = COLORS[i % COLORS.length]; ctx.lineWidth = cell * .34;
    ctx.beginPath(); p.forEach((rc, j) => { const [x, y] = centre(rc); if (j) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke();
  });
  game.pairs.forEach(([r1, c1, r2, c2], i) => {
    ctx.fillStyle = COLORS[i % COLORS.length];
    for (const rc of [[r1, c1], [r2, c2]]) { const [x, y] = centre(rc); ctx.beginPath(); ctx.arc(x, y, cell * .3, 0, Math.PI * 2); ctx.fill(); }
  });
  if (game.drag) { const p = game.paths[game.drag.i], h = p[p.length - 1]; if (h) { const [x, y] = centre(h); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, cell * .4, 0, Math.PI * 2); ctx.stroke(); } }
  const foot = $('.foot .stat'); if (foot) foot.innerHTML = `Pipes <b>${joined()} of ${game.pairs.length}</b> · Board <b>${Math.round(filled() / (game.n * game.n) * 100)}%</b> · Moves <b>${game.moves}</b>`;
}
function cellAt(e) {
  const b = $('#board').getBoundingClientRect();
  const c = Math.floor((e.clientX - b.left) / cell), r = Math.floor((e.clientY - b.top) / cell);
  return inb(r, c) ? [r, c] : null;
}
function wirePointer() {
  const c = $('#c');
  c.addEventListener('pointerdown', e => {
    e.preventDefault(); unlockAudio();
    if (game.won || game.drag) return;
    const at = cellAt(e); if (!at) return;
    const d = dotAt(...at), o = game.occ[at[0]][at[1]];
    let i = -1;
    if (d >= 0) { i = d; setPath(i, [at]); }                                   // from a dot: a fresh pipe
    else if (o >= 0) { i = o; cutAt(i, at); setPath(i, game.paths[i].concat([at])); }   // from a pipe: carry on from here
    if (i < 0) return;
    game.drag = { i, id: e.pointerId, changed: false }; game.moves++;
    try { c.setPointerCapture(e.pointerId); } catch { /* fine */ }
    draw();
  });
  c.addEventListener('pointermove', e => {
    if (!game.drag || e.pointerId !== game.drag.id) return;
    const at = cellAt(e); if (!at) return;
    moveTo(game.drag.i, at); draw();
  });
  const end = e => { if (game.drag && e.pointerId === game.drag.id) { game.drag = null; draw(); } };
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) c.addEventListener(ev, end);
}
document.addEventListener('contextmenu', e => e.preventDefault());
new ResizeObserver(() => { if (screen === 'play' && $('#stage')) { fit(); draw(); } }).observe(document.body);
window.addEventListener('keydown', e => { if (screen !== 'play') return; if (e.code === 'Escape') { screen = 'levels'; render(); } else if ((e.code === 'Enter' || e.code === 'Space') && game.won) $('#next').click(); });

/* ================================================================== start */
render();
window.__pipes = { LEVELS, game, load, play, step, moveTo, hint, checkWin, setPath, done: () => done, screen: () => screen, render };   // for the tests
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
