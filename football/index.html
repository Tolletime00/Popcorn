<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Football">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<!--
  Football: NFL bets, power rankings and matchups.
  One file on purpose: the styles and the script are below, and the typeface is embedded at the very end.
  Scores, spreads and EPA come from data/data.json, which a scheduled job in this repository rebuilds every half hour.
  Bets and power ratings are stored on the phone. Nothing is sent anywhere.
-->
<style>
/* ---------- tokens */
:root{
  --bg:#fff; --sheet:#fff; --ink:#000;
  --ink-2:rgba(0,0,0,.6); --ink-3:rgba(0,0,0,.36);
  --line:rgba(0,0,0,.1); --fill:rgba(0,0,0,.055);
  --acc:#e0883a; --win:#1f9d48; --loss:#d0342c; --push:rgba(0,0,0,.45);
  --g1:rgba(52,199,89,.2); --g2:rgba(52,199,89,.5); --r1:rgba(255,69,58,.18); --r2:rgba(255,69,58,.5);
  --font:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --sheet:#1c1c1e; --ink:#fff;
    --ink-2:rgba(255,255,255,.64); --ink-3:rgba(255,255,255,.4);
    --line:rgba(255,255,255,.16); --fill:rgba(255,255,255,.1);
    --win:#30d158; --loss:#ff6b63; --push:rgba(255,255,255,.5);
    --g1:rgba(52,199,89,.22); --g2:rgba(52,199,89,.55); --r1:rgba(255,69,58,.22); --r2:rgba(255,69,58,.55);
  }
}

/* ---------- base */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--ink);
  font:400 17px/1.35 var(--font);letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit}
input,select{font:inherit;letter-spacing:inherit;color:inherit;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;margin:0}
a{color:inherit}
p,h1,h2,h3,ol,ul{margin:0;padding:0}
ul,ol{list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{font-variant-numeric:tabular-nums lining-nums}

#app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-top:env(safe-area-inset-top);max-width:520px;margin:0 auto}
#view{position:relative;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body.dragging #view{overflow-y:hidden}

/* ---------- toolbar */
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
#tabs button{display:grid;justify-items:center;gap:2px;padding:8px 0 5px;font-size:11px;letter-spacing:.03em;color:var(--ink-3)}
#tabs svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tabs .f{fill:transparent;transition:fill .15s}
#tabs [aria-current=page]{color:var(--ink)}
#tabs [aria-current=page] .f{fill:var(--acc)}
body[data-view=install] #tabs,body[data-view=team] #tabs{display:none}

/* ---------- shared pieces */
.bar{display:grid;grid-template-columns:minmax(44px,1fr) minmax(0,auto) minmax(44px,1fr);align-items:center;min-height:52px;padding:4px 6px 0}
.bar h2{font-size:17px;font-weight:500;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .icon-btn{justify-self:start}
.bar .icon-btn~.icon-btn,.bar .right{justify-self:end}
.icon-btn{position:relative;min-width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
.icon-btn svg{width:22px;height:22px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 20px 4px;font-size:13px;color:var(--ink-3)}
.status .refresh{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);padding:6px 0 6px 10px}
.status .refresh svg{width:16px;height:16px}
.lead{font-size:28px;line-height:1.14;font-weight:300;letter-spacing:-.005em;text-align:center;text-wrap:balance}
.help{font-size:15px;line-height:1.4;color:var(--ink-2);text-align:center;text-wrap:pretty}
.note{padding:40px 32px;text-align:center;color:var(--ink-2);font-size:17px;line-height:1.4}
.quiet{display:inline-block;padding:10px 4px;font-size:15px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.primary{display:block;width:100%;height:54px;border-radius:27px;background:var(--acc);color:#000;font-size:18px;font-weight:500;text-align:center;transition:background .15s,color .15s}
.primary:disabled{background:var(--fill);color:var(--ink-3);cursor:default}
.primary:not(:disabled):active{filter:brightness(.94)}
.dock{padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.topbtn{padding:4px 20px 12px}
.page{min-height:100%}
.sec{display:flex;align-items:baseline;gap:10px;padding:18px 20px 4px}
.sec .nm{font-size:17px;font-weight:500}
.sec .ct{margin-left:auto;font-size:13px;color:var(--ink-3)}
.logo{display:block;width:28px;height:28px;object-fit:contain;flex:none}
.logo.lg{width:44px;height:44px}
.logo.none{display:grid;place-items:center;border-radius:14px;background:var(--fill);font-size:10px;font-weight:500;color:var(--ink-2)}
.pill{display:inline-block;min-width:26px;padding:1px 6px;border-radius:9px;background:var(--fill);font-size:12px;color:var(--ink-2);text-align:center}

/* ---------- Bets */
.tally{display:grid;justify-items:end;line-height:1.15;padding-right:8px}
.tally .pl{font-size:19px;font-weight:500}
.tally .rec{font-size:15px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.pos{color:var(--win)}.neg{color:var(--loss)}
.bets{padding:4px 0 8px}
.bet{display:grid;grid-template-columns:44px minmax(0,1fr) 54px 30px 72px;align-items:center;column-gap:6px;width:100%;padding:10px 20px;text-align:left}
.wkline{border:0;border-top:1px solid var(--line);margin:6px 20px}
.bet:active{background:var(--fill)}
.bet .wk{font-size:13px;color:var(--ink-3)}
.bet .b{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bet .s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bet .odds{font-size:15px;color:var(--ink-2);text-align:right}
.bet .out{font-size:15px;font-weight:500;text-align:center}
.bet .pl{font-size:16px;font-weight:500;text-align:right}
.bet .tw{font-size:11px;font-weight:400;color:var(--ink-3);white-space:nowrap}
.bet.W .out,.bet.W .pl,.bet.W .b{color:var(--win)}
.bet.L .out,.bet.L .pl,.bet.L .b{color:var(--loss)}
.bet.P .out,.bet.P .pl,.bet.P .b{color:var(--push)}
.bets .head{display:grid;grid-template-columns:44px minmax(0,1fr) 54px 30px 72px;column-gap:6px;padding:6px 20px 2px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.bets .head span:nth-child(3),.bets .head span:nth-child(5){text-align:right}
.bets .head span:nth-child(4){text-align:center}

/* ---------- sliders */
.sl{display:grid;gap:4px}
.sl .lb{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.sl .lb b{font-weight:500;color:var(--ink);font-size:16px}
.slider{position:relative;height:44px;touch-action:none;cursor:pointer;--p:.5}
.slider .rail{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--fill);overflow:hidden}
.slider .fill{height:100%;width:calc(17px + (100% - 34px) * var(--p));background:var(--acc)}
.slider .mid{position:absolute;top:50%;left:calc(17px + (100% - 34px) * var(--mid,0.5));width:2px;height:12px;margin:-6px 0 0 -1px;background:var(--ink-3);pointer-events:none}
.slider .thumb{position:absolute;top:50%;left:calc((100% - 34px) * var(--p));width:34px;height:34px;margin-top:-17px;border-radius:17px;background:var(--acc);box-shadow:0 0 0 3px var(--bg);transition:left .06s linear;pointer-events:none}
.slider input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.slider:focus-within .thumb{outline:2px solid var(--ink);outline-offset:3px}
.oddsin{display:flex;align-items:center;gap:8px}
.seg.mini{gap:4px}
.seg.mini button{flex:none;width:38px;height:34px;border-radius:17px;font-size:18px}
.box{width:72px;height:36px;border:0;border-radius:10px;background:var(--fill);text-align:center;font-size:17px;font-weight:500;outline:none;padding:0 6px}
.box:focus-visible{box-shadow:inset 0 0 0 1.5px var(--ink)}
.field{height:48px;border:0;border-radius:14px;background:var(--fill);padding:0 16px;font-size:17px;outline:none;width:100%;display:block}
select.field{font-weight:500;letter-spacing:.04em}

/* ---------- Power Rankings */
.stick{position:sticky;top:0;z-index:3;background:var(--bg)}
.stick .status{padding-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 32px 28px repeat(3,40px);column-gap:4px;padding:4px 54px 6px 56px;background:var(--bg);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:right}
.cols span{overflow:hidden;white-space:nowrap}
.cols span:first-child{text-align:left}
.cols .ov{grid-column:span 2;text-align:center}
.tier .sec{padding-top:14px}
.tier .sec .nm{font-size:16px;font-weight:500;padding:1px 10px;border-radius:12px;background:var(--fill)}
.tier .sec .nm.up{background:var(--g1)}.tier .sec .nm.dn{background:var(--r1)}
.tier.spare{display:none}
body.dragging .tier.spare{display:block}
.rows{min-height:6px;padding:0 0 4px}
.rows:empty{min-height:18px}
.row{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) 40px;align-items:center;column-gap:8px;padding:6px 6px 6px 20px;min-height:54px;background:var(--bg)}
.row.lifting{opacity:.25}
.row .tx{display:grid;grid-template-columns:minmax(0,1fr) 32px 28px repeat(3,40px);column-gap:4px;row-gap:2px;align-items:baseline;min-width:0;text-align:right;font-size:13px;color:var(--ink-2)}
.row .tx span{overflow:hidden;white-space:nowrap}
.row .nm{grid-row:span 2;align-self:center;display:flex;align-items:baseline;gap:8px;text-align:left}
.row .ab{font-size:17px;font-weight:500;letter-spacing:.04em;color:var(--ink)}
.row .rc{font-size:13px;color:var(--ink-2)}
.row .lab{text-align:left;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.row .tx .v{font-size:18px;font-weight:500}
.row .tx b{font-size:20px;font-weight:600;color:var(--ink)}
.row .tx .all{grid-row:span 2;align-self:center;font-size:17px;font-weight:600;color:var(--ink)}   /* the team as a whole, between the offense and defense rows, the size of the team's name */
.row .hd{width:40px;height:44px;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab}
.row .hd svg{width:20px;height:20px}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);border-radius:12px;background:var(--sheet);opacity:.96}
.ghost .row{background:transparent}
.rk .hint{padding:2px 20px 0;font-size:13px;color:var(--ink-3)}
.statseg{display:inline-flex;gap:4px;flex:none}
.statseg button{height:26px;padding:0 10px;border-radius:13px;background:var(--fill);font-size:12px;color:var(--ink-2);white-space:nowrap}
.statseg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:500}
.fine{padding:2px 20px 6px;font-size:12px;line-height:1.35;color:var(--ink-3)}
.team .epa.dv b small,.team .epa.dv span small{display:block;font-size:10px;font-weight:400;color:var(--ink-3);letter-spacing:.02em}
.team .epa .h.wide{grid-column:2 / 5;text-align:left;font-size:11px;letter-spacing:.04em;color:var(--ink-2);padding-top:6px}

/* ---------- one team: the game log */
.team .hero{display:flex;align-items:center;gap:14px;padding:4px 20px 12px}
.team .hero h1{font-size:26px;font-weight:500;letter-spacing:.04em;line-height:1.1}
.team .hero .rc{font-size:15px;color:var(--ink-2)}
.team .epa{display:grid;grid-template-columns:54px repeat(3,1fr);column-gap:6px;row-gap:2px;padding:0 20px 14px;font-size:15px;text-align:right}
.team .epa .lab{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);align-self:baseline}
.team .epa .h{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.team .epa b{font-weight:600}
.log{padding:0 20px 24px}
.game{display:grid;grid-template-columns:40px 28px minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:8px 12px;margin:0 0 6px;border-radius:12px;background:var(--fill)}
.game .wk{font-size:12px;color:var(--ink-3)}
.game .vs{font-size:15px}
.game .vs .ab{font-weight:500;letter-spacing:.04em}
.game .vs .pr{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--bg);font-size:12px;color:var(--ink-2);vertical-align:1px}
.game .sc{font-size:15px;font-weight:500;text-align:right;white-space:nowrap}
.game .sc small{font-weight:400;color:var(--ink-2);margin-left:6px}
.game.w2{background:var(--g2)}.game.w1{background:var(--g1)}.game.l1{background:var(--r1)}.game.l2{background:var(--r2)}
.game.bye{background:transparent;color:var(--ink-3)}
.game.pre .sc{font-weight:400;color:var(--ink-2)}

/* ---------- Matchups */
.wkbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:4px 6px 0;min-height:52px}
.wkbar h2{font-size:17px;font-weight:500;text-align:center}
.card{margin:8px 20px 4px;padding:12px 14px 10px;border-radius:16px;background:var(--fill)}
.card .when{font-size:12px;color:var(--ink-3);margin-bottom:8px;display:flex;justify-content:space-between}
.card .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.card .tm{display:flex;align-items:center;gap:8px;min-height:44px;margin:-6px -8px;padding:6px 8px;border-radius:14px;width:calc(100% + 16px)}
.card .tm.home{justify-content:flex-end}
.card .tm:active{background:var(--line)}
.card .tm .ab{font-size:19px;font-weight:500;letter-spacing:.04em}
.card .tm .pr{font-size:12px;color:var(--ink-2);padding:1px 6px;border-radius:9px;background:var(--bg)}
.card .at{font-size:13px;color:var(--ink-3)}
.card .line{display:flex;justify-content:center;align-items:baseline;gap:14px;margin:10px 0 4px;font-size:14px;color:var(--ink-2)}
.card .line b{font-size:17px;font-weight:600;color:var(--ink)}
.card .line .lb{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.card .cmp{display:grid;grid-template-columns:54px repeat(3,1fr);gap:6px;align-items:stretch;margin-top:8px}
.card .cmp .who{display:grid;align-content:center;font-size:12px;color:var(--ink-2);line-height:1.2}
.card .cmp .who b{font-size:15px;font-weight:500;letter-spacing:.04em;color:var(--ink)}
.chip{display:grid;justify-items:center;gap:1px;padding:6px 2px 5px;border-radius:10px;background:var(--bg)}
.chip .k{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.chip .v{font-size:15px;font-weight:600;white-space:nowrap}
.chip .v i{font-style:normal;font-size:17px}
.chip .v small{font-size:10px;font-weight:400;color:var(--ink-3);margin:0 3px}
.card .rest{margin:8px 0 0;text-align:center;font-size:12px;line-height:1.35;color:var(--ink-2)}
.card .rest b{font-weight:500;color:var(--ink)}
.chip .base{font-size:10px;color:var(--ink-3)}
.chip.g1{background:var(--g1)}.chip.g2{background:var(--g2)}.chip.r1{background:var(--r1)}.chip.r2{background:var(--r2)}
.card .final{font-size:13px;color:var(--ink-2);text-align:center;margin-top:8px}
.card .final b{font-weight:500;color:var(--ink)}

/* ---------- add to Home Screen */
.install{min-height:100%;display:grid;align-content:center;gap:22px;padding:32px 28px}
.install img{width:84px;height:84px;border-radius:19px;justify-self:center}
.install h1{font-size:28px;line-height:1.14;font-weight:300;text-align:center;text-wrap:balance}
.install ol{display:grid;gap:10px;padding-left:24px;font-size:17px;line-height:1.35;list-style:decimal}
.install .help{font-size:15px;line-height:1.4;color:var(--ink-2)}
.install .quiet{justify-self:center}

/* ---------- sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);opacity:0;transition:opacity .22s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;max-height:92%;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:22px 22px 0 0;padding:6px 0 calc(14px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.open>.scrim{opacity:1}
.open>.sheet{transform:none}
.sheet .head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:6px 10px 2px 24px}
.sheet .head h2{font-size:21px;font-weight:500}
.item{display:grid;gap:1px;width:100%;padding:13px 24px;cursor:pointer}
.item:active{background:var(--fill)}
.item .l{font-size:17px}
.item .s{font-size:13px;color:var(--ink-2)}
.item.danger .l{color:#d0342c}
.item:disabled{opacity:.4;cursor:default}
.sheet .form{display:grid;gap:14px;padding:8px 24px 6px}
.sheet .foot{padding:12px 24px 4px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.sheet .actions{display:grid;gap:4px;padding:6px 24px 2px}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:40px;border-radius:20px;background:var(--fill);font-size:15px;text-align:center;display:grid;place-items:center}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:500}
.about{margin-top:8px;padding:16px 24px 4px;border-top:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--ink-2)}
.preview{padding:4px 24px 0;font-size:15px;color:var(--ink-2);text-align:center}
.preview b{font-weight:500;color:var(--ink)}

/* ---------- toast */
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:40;width:max-content;max-width:calc(100% - 48px);padding:10px 18px;border-radius:21px;background:var(--ink);color:var(--bg);font-size:15px;line-height:1.3;text-align:center;opacity:0;transform:translate(-50%,-10px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:380px){
  .bet{grid-template-columns:40px minmax(0,1fr) 50px 26px 66px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections">
    <button type="button" data-tab="bets"><svg viewBox="0 0 26 26" aria-hidden="true"><rect class="f" x="3.5" y="7" width="19" height="12" rx="2.5"/><circle cx="13" cy="13" r="3"/><path d="M6.5 10.5v5M19.5 10.5v5"/></svg><span>Bets</span></button>

<script>
(() => {
'use strict';

const APP = 'Football';
const DATA_URL = 'data/data.json';
const BACKUP_NAME = 'Football backup.json';
const HFA = 1.5;   // home field, in points
const TEAMS = { ARI: 'Arizona Cardinals', ATL: 'Atlanta Falcons', BAL: 'Baltimore Ravens', BUF: 'Buffalo Bills', CAR: 'Carolina Panthers', CHI: 'Chicago Bears', CIN: 'Cincinnati Bengals', CLE: 'Cleveland Browns', DAL: 'Dallas Cowboys', DEN: 'Denver Broncos', DET: 'Detroit Lions', GB: 'Green Bay Packers', HOU: 'Houston Texans', IND: 'Indianapolis Colts', JAX: 'Jacksonville Jaguars', KC: 'Kansas City Chiefs', LA: 'Los Angeles Rams', LAC: 'Los Angeles Chargers', LV: 'Las Vegas Raiders', MIA: 'Miami Dolphins', MIN: 'Minnesota Vikings', NE: 'New England Patriots', NO: 'New Orleans Saints', NYG: 'New York Giants', NYJ: 'New York Jets', PHI: 'Philadelphia Eagles', PIT: 'Pittsburgh Steelers', SEA: 'Seattle Seahawks', SF: 'San Francisco 49ers', TB: 'Tampa Bay Buccaneers', TEN: 'Tennessee Titans', WAS: 'Washington Commanders' };
const ABBRS = Object.keys(TEAMS);
const RATING_MAX = 7, RATING_MIN = -10;

/* ================================================================== helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const arr = v => Array.isArray(v) ? v : [];
const sign = (n, d = 1) => n == null ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(d).replace(/\.0$/, '');
const spreadText = n => n == null ? '–' : n === 0 ? 'PK' : sign(n, 1);
const oddsText = n => n == null ? '–' : (n > 0 ? '+' : '−') + Math.abs(n);
const epaText = v => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2).replace(/^0/, '');
const pct = (v, d = 0) => { if (v == null) return '–'; const a = Math.abs(v).toFixed(d); return (parseFloat(a) === 0 ? '' : v > 0 ? '+' : '−') + a + '%'; };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const DVOA_NOTE = 'DVOA-style is our own calculation from the play-by-play, built the way FTN describes DVOA; it is not FTN’s DVOA. Offense: higher is better. Defense: lower is better.';
const money = n => { const a = Math.abs(n), s = Number.isInteger(Math.round(a * 100) / 100) && Math.abs(a - Math.round(a)) < .005 ? String(Math.round(a)) : a.toFixed(2); return (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + s; };
const timeFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const stampFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const dayKey = iso => { const d = new Date(iso); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

const ICON = {
  more: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>',
  fwd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5l7.5 7.5L9 19.5"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 9h10M7 15h10"/></svg>',
};

/* ================================================================== storage */
const K = { bets: 'football.bets', ranks: 'football.ranks', data: 'football.data', meta: 'football.meta', skip: 'football.skipInstall' };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
let bets = arr(LS.get(K.bets, []));
let ranks = arr(LS.get(K.ranks, []));   // [{ team, rating }] top to bottom
let data = LS.get(K.data, null);        // the latest data.json
if (data && !Array.isArray(data.games)) data = null;
let meta = Object.assign({ unsaved: 0, lastBackup: null, fetched: null }, LS.get(K.meta, {}));
function persist(changes = 0) {
  if (!LS.set(K.bets, bets) || !LS.set(K.ranks, ranks)) toast('Couldn’t save on this phone. Its storage may be full.');
  if (changes) { meta.unsaved = (meta.unsaved || 0) + changes; LS.set(K.meta, meta); }
}
const games = () => data ? data.games : [];
const epaOf = t => (data && data.epa && data.epa[t]) || null;
const dvoaOf = t => (data && data.dvoa && data.dvoa[t]) || null;
// where a team's DVOA-style number sits among the 32: offense and total high is good, defense low is good
const dvoaRank = (t, key) => { if (!data || !data.dvoa || !data.dvoa[t]) return null; const low = key.startsWith('def'); const vals = Object.values(data.dvoa).map(d => d[key]).filter(v => v != null).sort((a, b) => low ? a - b : b - a); return vals.indexOf(data.dvoa[t][key]) + 1; };
const statIs = () => meta.stat === 'dvoa' && data && data.dvoa ? 'dvoa' : 'epa';
// The six stats as ranks of the 32, by whichever the switch shows: offense high-is-good, defense low-is-good, 1 = best.
const STAT_KEYS = { off: ['off', 'offPass', 'offRush'], def: ['def', 'defPass', 'defRush'] };
const statValue = (t, side, k) => { if (statIs() === 'dvoa') { const d = dvoaOf(t); return d ? d[STAT_KEYS[side][k]] : null; } const e = epaOf(t); return e && e[side] ? e[side][k] : null; };
function rankTable() {
  const L = {};
  for (const side of ['off', 'def']) for (let k = 0; k < 3; k++) L[side + k] = ABBRS.map(t => statValue(t, side, k)).filter(v => v != null).sort((a, b) => side === 'off' ? b - a : a - b);
  // the team as a whole: the average of its offense and defense, the defense turned round so that lower (better) counts for it
  const net = t => { const o = statValue(t, 'off', 0), d = statValue(t, 'def', 0); return o == null || d == null ? null : (o - d) / 2; };
  L.all = ABBRS.map(net).filter(v => v != null).sort((a, b) => b - a);
  const n = Math.max(2, ...Object.values(L).map(x => x.length));
  const rankOf = (t, side, k) => { const v = statValue(t, side, k); return v == null ? null : L[side + k].indexOf(v) + 1; };
  const rankAll = t => { const v = net(t); return v == null ? null : L.all.indexOf(v) + 1; };
  // green for the best, red for the worst, the plain text colour in the middle
  const style = r => { if (r == null) return ''; const pos = (r - 1) / (n - 1), p = Math.round(Math.abs(pos - .5) * 200); return ` style="color:color-mix(in srgb, var(--${pos < .5 ? 'win' : 'loss'}) ${p}%, var(--ink-2))"`; };
  return { rankOf, rankAll, style, n };
}
// Who is better rested for a game, and why: from the days of rest in the schedule and each team's previous game.
function restNote(g) {
  const all = games();
  const info = (t, rest) => {
    const prev = all.filter(x => (x.away === t || x.home === t) && x.kickoff < g.kickoff).sort((a, b) => b.kickoff.localeCompare(a.kickoff))[0];
    let why = '';
    if (rest != null && rest >= 13) why = 'off a bye';
    else if (prev && prev.abroad) why = `played in ${prev.abroad}`;
    else if (prev) { const d = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'America/New_York' }).format(new Date(prev.kickoff)); if (d === 'Thu') why = 'played Thursday'; else if (d === 'Mon') why = 'played Monday'; else if (d === 'Sat') why = 'played Saturday'; else if (d === 'Fri') why = 'played Friday'; }
    return { t, rest, why };
  };
  const a = info(g.away, g.awayRest), h = info(g.home, g.homeRest);
  if (a.rest == null || h.rest == null) return '';
  const days = x => `${x.rest} day${x.rest === 1 ? '' : 's'}`;
  if (a.rest === h.rest) {
    if (a.rest <= 5) return `Short week for both · ${days(a)}`;
    if (a.why || h.why) return `Even rest · ${[a.why && `${a.t} ${a.why}`, h.why && `${h.t} ${h.why}`].filter(Boolean).join(', ')}`;
    return '';
  }
  const adv = a.rest > h.rest ? a : h, oth = adv === a ? h : a;
  return `<b>Rest edge ${adv.t}</b> · ${days(adv)}${adv.why ? ` (${adv.why})` : ''} vs ${oth.t} ${days(oth)}${oth.why ? ` (${oth.why})` : ''}`;
}
const statSeg = () => `<span class="statseg" role="group" aria-label="Which numbers to show"><button type="button" data-stat="epa" aria-pressed="${statIs() === 'epa'}">EPA</button><button type="button" data-stat="dvoa" aria-pressed="${statIs() === 'dvoa'}"${data && data.dvoa ? '' : ' disabled'}>DVOA-style</button></span>`;
const wireStatSeg = root => { for (const b of $$('.statseg button', root)) b.addEventListener('click', () => { if (meta.stat === b.dataset.stat) return; meta.stat = b.dataset.stat; LS.set(K.meta, meta); render(true); }); };

/* ================================================================== the season */
// Records from the finals, team by team.
function record(team) {
  let w = 0, l = 0, t = 0;
  for (const g of games()) {
    if (g.status !== 'post' || (g.away !== team && g.home !== team)) continue;
    const mine = g.away === team ? g.awayScore : g.homeScore, theirs = g.away === team ? g.homeScore : g.awayScore;
    if (mine > theirs) w++; else if (mine < theirs) l++; else t++;
  }
  return { w, l, t, text: t ? `${w}-${l}-${t}` : `${w}-${l}` };
}
// The week to show: the current one until its last game is six hours old, then the next.
function upcomingWeek() {
  const now = Date.now();
  for (let w = 1; w <= 18; w++) {
    const wk = games().filter(g => g.week === w);
    if (!wk.length) continue;
    const last = Math.max(...wk.map(g => Date.parse(g.kickoff)));
    if (now < last + 6 * 3600 * 1000) return w;
  }
  return 18;
}
const gameOf = (week, team) => games().find(g => g.week === week && (g.away === team || g.home === team)) || null;
const ratingOf = team => { const r = ranks.find(x => x.team === team); return r ? r.rating : 0; };

// Keep the rankings list honest: every team once, newcomers at the bottom of the middle.
function tidyRanks() {
  ranks = ranks.filter(r => TEAMS[r.team]).filter((r, i, a) => a.findIndex(x => x.team === r.team) === i);
  for (const r of ranks) r.rating = Math.max(RATING_MIN, Math.min(RATING_MAX, Math.round(r.rating || 0)));
  const missing = ABBRS.filter(t => !ranks.some(r => r.team === t));
  if (missing.length) {
    const net = t => { const e = epaOf(t); return e && e.off[0] != null && e.def[0] != null ? e.off[0] - e.def[0] : 0; };
    missing.sort((a, b) => net(b) - net(a));
    const at = ranks.findIndex(r => r.rating < 0);
    ranks.splice(at < 0 ? ranks.length : at, 0, ...missing.map(team => ({ team, rating: 0 })));
  }
}

/* ================================================================== bets */
const risk = odds => odds < 0 ? -odds : 10000 / odds;   // what it costs to win $100
function settle(b) {
  if (b.override) return { out: b.override };
  const g = gameOf(b.week, b.team);
  if (!g) return { out: null, note: 'No game that week' };
  const mine = g.away === b.team ? g.awayScore : g.homeScore, theirs = g.away === b.team ? g.homeScore : g.awayScore;
  const opp = g.away === b.team ? `@ ${g.home}` : `vs ${g.away}`;
  if (g.status !== 'post') return { out: null, note: g.status === 'in' ? `${opp} · ${mine}–${theirs}${g.detail ? ' · ' + g.detail : ''}` : `${opp} · ${timeFmt.format(new Date(g.kickoff))}`, live: g.status === 'in' };
  const m = mine - theirs + b.spread;
  return { out: m > 0 ? 'W' : m < 0 ? 'L' : 'P', note: `${opp} · ${mine}–${theirs}` };
}
const payout = (b, out) => out === 'W' ? 100 : out === 'L' ? -risk(b.odds) : 0;
function season() {
  let pl = 0, w = 0, l = 0, p = 0;
  for (const b of bets) { const { out } = settle(b); if (!out) continue; pl += payout(b, out); if (out === 'W') w++; else if (out === 'L') l++; else p++; }
  return { pl: Math.round(pl * 100) / 100, w, l, p, text: p ? `${w}-${l}-${p}` : `${w}-${l}` };
}

/* ================================================================== data: the scores, spreads and EPA */
let fetching = false;
async function refreshData(manual) {
  if (fetching) return;
  fetching = true;
  for (const b of $$('.refresh, #refresh')) b.classList.add('spin');
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(String(res.status));
    const d = await res.json();
    if (!Array.isArray(d.games)) throw new Error('shape');
    const changed = !data || d.updated !== data.updated;
    data = d; LS.set(K.data, data);
    meta.fetched = new Date().toISOString(); LS.set(K.meta, meta);
    if (!meta.ranked) ranks = [];   // nothing ranked yet: the first order comes from EPA
    tidyRanks(); persist();
    render(true);
    if (manual) toast(changed ? 'Updated.' : 'Already up to date.');
  } catch (e) {
    if (manual) toast(data ? 'Couldn’t reach the data. Showing what was saved.' : 'Couldn’t reach the data. It needs the internet.');
  } finally {
    fetching = false;
    for (const b of $$('.refresh, #refresh')) b.classList.remove('spin');
  }
}
const stamp = () => data && data.updated ? `Data from ${stampFmt.format(new Date(data.updated))}` : 'No data yet';

/* ================================================================== navigation */
const viewEl = $('#view');
const homes = { bets: { name: 'bets' }, rk: { name: 'rk' }, mu: { name: 'mu', week: null } };
const state = { tab: 'bets', stack: [] };
const top = () => state.stack[state.stack.length - 1] || homes[state.tab];
function go(page) { top().scroll = viewEl.scrollTop; state.stack.push(page); history.pushState({ d: state.stack.length }, ''); render(); }
function back() { if (state.stack.length) history.back(); }
window.addEventListener('popstate', e => { const d = (e.state && e.state.d) || 0; if (d < state.stack.length) { state.stack.length = d; closeSheet(true); render(); } });
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const needsInstall = () => isIOS() && !standalone() && !LS.get(K.skip, false);
function render(keepScroll) {
  const page = top();
  if (keepScroll) page.scroll = viewEl.scrollTop;
  const name = needsInstall() ? 'install' : page.name;
  document.body.dataset.view = name;
  for (const b of $$('#tabs button')) { if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }
  VIEWS[name](page);
  viewEl.scrollTop = page.scroll || 0;
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  if (b.dataset.tab === state.tab && !state.stack.length) { viewEl.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const d = state.stack.length; state.stack = []; if (d) history.go(-d);
  homes[b.dataset.tab].scroll = 0; state.tab = b.dataset.tab; render();
});

/* ================================================================== small UI services */
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }
const sheets = $('#sheets');
let sheetTurn = 0;
function openSheet(html, mount) {
  const turn = ++sheetTurn;
  sheets.classList.remove('open');
  sheets.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  $('.scrim', sheets).addEventListener('click', () => closeSheet());
  const el = $('.sheet', sheets);
  for (const x of $$('[data-close]', el)) x.addEventListener('click', () => closeSheet());

}
function closeSheet(now) {
  if (!sheets.firstChild) return;
  const turn = ++sheetTurn;
  sheets.classList.remove('open');
  if (now) sheets.innerHTML = ''; else setTimeout(() => { if (turn === sheetTurn) sheets.innerHTML = ''; }, 320);
}
const head = title => `<div class="head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>`;
function arm(btn, label, fn) {
  let armed = 0;
  btn.addEventListener('click', () => {
    if (Date.now() - armed < 4000) return fn();
    armed = Date.now(); const l = $('.l', btn) || btn; const was = l.textContent; l.textContent = `Tap again to ${label}`;
    setTimeout(() => { if (btn.isConnected) l.textContent = was; }, 4000);
  });
}
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return 'shared'; }

function logo(team, cls = '') {

}
document.addEventListener('error', e => {   // a missing logo becomes the abbreviation
  const el = e.target;
  if (!(el instanceof HTMLImageElement) || !el.classList.contains('logo')) return;
  const s = document.createElement('span'); s.className = el.className + ' none'; s.textContent = el.dataset.ab || ''; el.replaceWith(s);
}, true);

/* ---------- a slider over a list of values; a tap anywhere on it works as well as a drag */
function sliderHTML(id, label, values, index, fmt, mid) {
  const p = values.length > 1 ? index / (values.length - 1) : 0;
  return `<div class="sl" data-sl="${id}" data-i="${index}"><div class="lb"><span>${esc(label)}</span><b class="num">${esc(fmt(values[index]))}</b></div>
    <div class="slider" style="--p:${p}${mid != null ? `;--mid:${mid / (values.length - 1)}` : ''}"><div class="rail"><div class="fill"></div></div>${mid != null ? '<div class="mid"></div>' : ''}<div class="thumb"></div><input type="range" min="0" max="${values.length - 1}" step="1" value="${index}" aria-label="${esc(label)}"></div></div>`;
}
function wireSlider(root, id, values, fmt, onChange) {
  const sl = $(`[data-sl="${id}"]`, root), el = $('.slider', sl), input = $('input[type=range]', el), out = $('.lb b', sl);
  const set = (i, silent) => { i = Math.max(0, Math.min(values.length - 1, Math.round(i))); sl.dataset.i = i; el.style.setProperty('--p', String(values.length > 1 ? i / (values.length - 1) : 0)); input.value = i; if (out) out.textContent = fmt(values[i]); if (onChange && !silent) onChange(values[i]); };

  el.addEventListener('pointerdown', e => { drag = true; try { el.setPointerCapture(e.pointerId); } catch {} set(fromX(e.clientX)); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (drag) set(fromX(e.clientX)); });

  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);

}
const WEEKS = Array.from({ length: 18 }, (_, i) => i + 1);
const SPREADS = Array.from({ length: 81 }, (_, i) => (i - 40) / 2);
const ODDS = [...Array.from({ length: 61 }, (_, i) => -400 + i * 5), ...Array.from({ length: 61 }, (_, i) => 100 + i * 5)];
const nearestOdds = v => ODDS.reduce((best, o, i) => Math.abs(o - v) < Math.abs(ODDS[best] - v) ? i : best, 0);
const nearestSpread = v => SPREADS.reduce((best, o, i) => Math.abs(o - v) < Math.abs(SPREADS[best] - v) ? i : best, 0);

/* ---------- hold and drag (the Power Rankings) */
function enableDrag(root, onDrop, onLift) {
  let press = null, drag = null, raf = 0, dropped = 0;
  const prevent = e => { if (drag) e.preventDefault(); };
  root.addEventListener('click', e => { if (Date.now() - dropped < 500) { e.stopPropagation(); e.preventDefault(); } }, true);
  root.addEventListener('pointerdown', e => {
    const row = e.target.closest('.row[data-drag]');
    if (!row || e.button || drag) return;
    press = { row, x: e.clientX, y: e.clientY, id: e.pointerId, timer: 0 };
    if (e.target.closest('.hd')) { e.preventDefault(); lift(); } else press.timer = setTimeout(lift, 300);
  });
  const cancel = () => { if (press) { clearTimeout(press.timer); press = null; } };
  root.addEventListener('pointermove', e => {
    if (press && !drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) cancel();
    if (drag && e.pointerId === drag.id) move(e);
  });
  root.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) drop(true); cancel(); });
  root.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) drop(false); cancel(); });
  root.addEventListener('contextmenu', e => { if (e.target.closest('.row[data-drag]')) e.preventDefault(); });
  function lift() {
    const row = press.row, box = row.getBoundingClientRect();
    drag = { row, id: press.id, dx: press.x - box.left, dy: press.y - box.top, x: press.x, y: press.y };
    try { row.setPointerCapture(press.id); } catch { /* fine */ }
    const ghost = document.createElement('div');
    ghost.className = 'ghost'; ghost.style.width = box.width + 'px'; ghost.innerHTML = row.outerHTML;
    document.body.append(ghost); drag.ghost = ghost;
    row.classList.add('lifting');
    const before = row.getBoundingClientRect().top;
    document.body.classList.add('dragging');
    if (onLift) onLift(row);
    viewEl.scrollTop += row.getBoundingClientRect().top - before;   // sections revealed above it must not shift it under the finger
    document.addEventListener('touchmove', prevent, { passive: false });
    if (navigator.vibrate) navigator.vibrate(8);
    press = null;
    place(drag.x, drag.y);
    raf = requestAnimationFrame(scrollLoop);
  }
  function place(x, y) { drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px'; }
  function move(e) {
    drag.x = e.clientX; drag.y = e.clientY;
    place(e.clientX, e.clientY);
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !root.contains(el)) return;
    const over = el.closest('.row[data-drag]');
    if (over && over !== drag.row) { const b = over.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) over.before(drag.row); else over.after(drag.row); return; }
    const list = el.closest('.rows') || ((el.closest('.sec') || el.closest('[data-list]')) && $('.rows', el.closest('[data-list]')));
    if (list && !list.contains(drag.row)) { const b = list.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) list.prepend(drag.row); else list.append(drag.row); }
  }
  function scrollLoop() {
    if (!drag) return;
    const b = viewEl.getBoundingClientRect(), edge = 70;
    if (drag.y < b.top + edge) viewEl.scrollTop -= Math.ceil((b.top + edge - drag.y) / 6);
    else if (drag.y > b.bottom - edge) viewEl.scrollTop += Math.ceil((drag.y - (b.bottom - edge)) / 6);
    raf = requestAnimationFrame(scrollLoop);
  }
  function drop(keep) {
    cancelAnimationFrame(raf);
    const row = drag.row;
    drag.ghost.remove(); row.classList.remove('lifting');
    document.body.classList.remove('dragging');
    document.removeEventListener('touchmove', prevent);
    drag = null; dropped = Date.now();
    if (keep) onDrop(row); else render(true);
  }
}

    f.addEventListener('submit', e => {
      e.preventDefault();
      if (Math.abs(oddsVal) < 100) oddsVal = oddsVal < 0 ? -100 : 100;
      const rec = { week: weekS.get(), team: sel.value, spread: spreadVal, odds: oddsVal };
      if (b) Object.assign(b, rec, { override }); else bets.push({ id: 'b' + uid(), ...rec, override: null, placed: new Date().toISOString() });
      persist(1); closeSheet(); render(true);
    });
    if (b) arm($('#del', el), 'delete', () => { bets = bets.filter(x => x.id !== id); persist(1); closeSheet(); render(true); });
  });
}

/* ================================================================== backup and the three dots */
const backupText = () => JSON.stringify({ app: APP, version: 1, saved: new Date().toISOString(), bets, ranks }, null, 1);
async function backup() {
  const how = await shareFile(BACKUP_NAME, backupText(), 'application/json');
  if (how === 'cancelled') return;
  meta.unsaved = 0; meta.lastBackup = new Date().toISOString(); LS.set(K.meta, meta);
  toast(how === 'shared' ? 'Backed up.' : `Saved ${BACKUP_NAME} to your downloads.`);
  closeSheet(); render(true);
}
async function restore(file) {
  let d = null;
  try { d = JSON.parse(await file.text()); } catch { /* not ours */ }
  if (!d || d.app !== APP || !Array.isArray(d.bets)) { toast('That isn’t a Football backup.'); return; }
  openSheet(`${head('Replace everything?')}<p class="foot">The backup from ${esc(d.saved ? new Date(d.saved).toLocaleString() : 'an unknown time')} replaces your ${plural(bets.length, 'bet', 'bets')} and rankings with its ${plural(d.bets.length, 'bet', 'bets')} and rankings.</p>
    <button type="button" class="item danger" id="go"><span class="l">Replace with the backup</span></button>
    <button type="button" class="item" data-close><span class="l">Keep what I have</span></button>`, el => {
    arm($('#go', el), 'replace', () => { bets = arr(d.bets); ranks = arr(d.ranks); meta.ranked = true; tidyRanks(); persist(); closeSheet(); render(); toast('Restored.'); });
  });
}
$('#pick').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) restore(f); });
function moreSheet() {
  const n = meta.unsaved || 0;
  const status = n ? `${plural(n, 'change', 'changes')} since ${meta.lastBackup ? 'your backup on ' + new Date(meta.lastBackup).toLocaleDateString() : 'you started'}` : meta.lastBackup ? `Up to date. Last backed up ${new Date(meta.lastBackup).toLocaleDateString()}` : 'Not backed up yet';
  openSheet(`${head(APP)}
    <button type="button" class="item" id="backup"><span class="l">Back up</span><span class="s">${esc(status)}. Bets and rankings, one file for OneDrive.</span></button>
    <label class="item" for="pick"><span class="l">Restore from a backup</span><span class="s">Pick ${BACKUP_NAME} from OneDrive</span></label>
    <button type="button" class="item" id="reset"><span class="l">Reset the power rankings</span><span class="s">Every team back to 0</span></button>
    <p class="about">Scores, spreads and EPA are rebuilt every half hour from nflverse play-by-play data (the data behind rbsdm.com) and ESPN’s scoreboard. ${esc(stamp())}. Bets and rankings stay on this phone.</p>
    <p class="about" style="border-top:0;padding-top:4px">${DVOA_NOTE} On the 2024 and 2025 seasons it landed within about three points of FTN’s published numbers for the typical team.</p>`, el => {
    $('#backup', el).addEventListener('click', backup);
    arm($('#reset', el), 'reset', () => { ranks = []; meta.ranked = false; tidyRanks(); persist(1); closeSheet(); render(true); });
  });
}

/* ================================================================== start */
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('focusout', () => setTimeout(() => { if (!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) window.scrollTo(0, 0); }, 60));
history.replaceState({ d: 0 }, '');
tidyRanks();
render();
refreshData(false);
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!meta.fetched || Date.now() - Date.parse(meta.fetched) > 10 * 60 * 1000)) refreshData(false); });
window.addEventListener('online', () => refreshData(false));
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
