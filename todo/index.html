<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<!--
  To-Do: a calendar of what is coming up, the things that come round every week and every month, a list, and the dates that come round every year.
  One file on purpose: the styles and the script are below, and the typeface is embedded at the very end.
  Everything is stored on the phone. Nothing is sent anywhere.
-->
<style>
/* ---------- tokens */
:root{
  --bg:#fff; --sheet:#fff; --ink:#000;
  --ink-2:rgba(0,0,0,.6); --ink-3:rgba(0,0,0,.36);
  --line:rgba(0,0,0,.1); --fill:rgba(0,0,0,.055);
  --acc:#bf5af2; --blue:#0a84ff; --green:#30d158;
  --font:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --sheet:#1c1c1e; --ink:#fff;
    --ink-2:rgba(255,255,255,.64); --ink-3:rgba(255,255,255,.4);
    --line:rgba(255,255,255,.16); --fill:rgba(255,255,255,.1);
  }
}

/* ---------- base */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--ink);
  font:400 17px/1.35 var(--font);letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit}
input,select{font:inherit;letter-spacing:inherit;color:inherit;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;margin:0}
input::-webkit-date-and-time-value{text-align:left}
a{color:inherit}
p,h1,h2,h3,ol,ul{margin:0;padding:0}
ul,ol{list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

#app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-top:env(safe-area-inset-top);max-width:520px;margin:0 auto}
#view{position:relative;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body.dragging #view{overflow-y:hidden}

/* ---------- toolbar */
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
#tabs button{display:grid;justify-items:center;gap:2px;padding:8px 0 5px;font-size:11px;letter-spacing:.03em;color:var(--ink-3)}
#tabs svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tabs .f{fill:transparent;transition:fill .15s}
#tabs [aria-current=page]{color:var(--ink)}
#tabs [aria-current=page] .f{fill:var(--acc)}
body[data-view=install] #tabs{display:none}

/* ---------- shared pieces */
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;min-height:48px;padding:4px 6px 0}
.bar h2{font-size:17px;font-weight:500;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{position:relative;min-width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:4px;background:var(--acc)}
.lead{font-size:28px;line-height:1.14;font-weight:300;letter-spacing:-.005em;text-align:center;text-wrap:balance}
.help{font-size:15px;line-height:1.4;color:var(--ink-2);text-align:center;text-wrap:pretty}
.note{padding:40px 32px;text-align:center;color:var(--ink-2);font-size:17px;line-height:1.4}
.quiet{display:inline-block;padding:10px 4px;font-size:15px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.primary{display:block;width:100%;height:54px;border-radius:27px;background:var(--acc);color:#000;font-size:18px;font-weight:500;text-align:center;transition:background .15s,color .15s}
.primary:disabled{background:var(--fill);color:var(--ink-3);cursor:default}
.primary:not(:disabled):active{filter:brightness(.94)}
.more-btn{display:block;margin:4px auto 28px}

.field{height:48px;border:0;border-radius:14px;background:var(--fill);padding:0 16px;font-size:17px;outline:none;width:100%;display:block}
.field::placeholder{color:var(--ink-3)}
.field:focus-visible{box-shadow:inset 0 0 0 1.5px var(--ink)}
select.field{background-image:none}
input[type=date].field{min-height:48px;line-height:48px;-webkit-user-select:none;user-select:none}

/* ---------- the lists */
.page{min-height:100%;padding-bottom:24px}
.sec{display:flex;align-items:baseline;gap:8px;padding:20px 8px 2px 20px}
.sec .nm{font-size:17px;font-weight:500}
.sec .tag{font-size:13px;color:var(--acc);font-weight:500;letter-spacing:.02em}
.sec .ct{font-size:13px;color:var(--ink-3);font-variant-numeric:lining-nums}
.sec .plus{margin-left:auto;align-self:center;width:40px;height:36px;display:grid;place-items:center;border-radius:18px;color:var(--ink-3)}
.sec .plus svg{width:20px;height:20px}
.sec .plus:active{background:var(--fill);color:var(--ink)}
.sec.over .nm{color:#d0342c}
.sec.today .nm{color:var(--ink)}
button.sec{width:100%;text-align:left}
button.secname{font:inherit;font-size:17px;font-weight:500;text-align:left}
.rows{min-height:6px;padding:0 0 4px}
.rows:empty{min-height:14px}
.row{position:relative;display:grid;grid-template-columns:44px 14px minmax(0,1fr) auto auto;align-items:center;column-gap:6px;padding:2px 6px 2px 8px;min-height:46px;background:var(--bg);transition:opacity .15s}
.row.lifting{opacity:.25}
.row .hd{width:40px;height:44px;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab}
.row .hd svg{width:20px;height:20px}
.row.bye{overflow:hidden;animation:bye .28s ease-in forwards}
@keyframes bye{to{opacity:0;min-height:0;height:0;padding-top:0;padding-bottom:0;transform:translateX(24px)}}
.row.bye .ck,.row.bye .tx{padding:0}
.row .ck{width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3)}
.row .ck i{width:24px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--ink-3);display:grid;place-items:center;color:transparent;transition:background .15s,box-shadow .15s,color .15s}
.row .ck svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.row.done .ck i{background:var(--acc);box-shadow:none;color:#000}
.row .star{width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3)}
.row .star svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.dot{display:block;width:10px;height:10px;border-radius:5px;background:transparent}
.dot.p{background:var(--blue)}
.dot.w{background:var(--green)}
.row .tx{display:grid;gap:1px;min-width:0;padding:8px 0;text-align:left}
.row .t{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--ink-2);line-height:1.3}
.row.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.row .r{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:lining-nums;padding-right:4px}
.row .r:last-child{padding-right:10px}
.row .r.d{color:var(--ink-2)}
.cal .row.rec .t{font-style:italic;color:var(--ink-2)}
.cal .row.rec .s{font-style:italic}
.row.divider{min-height:36px;padding-top:0;padding-bottom:0}
.row.divider .tx{display:flex;align-items:center;gap:10px;padding:6px 0}
.row.divider .ln{flex:1;height:1px;background:var(--line)}
.row.divider .t{font-size:11px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-style:normal;white-space:nowrap}
.row.divider .hd{height:36px}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);border-radius:12px;background:var(--sheet);opacity:.96;transform:scale(1.02)}
.ghost .row{background:transparent}
.empty{padding:6px 20px 10px 66px;font-size:14px;color:var(--ink-3)}
.cal .hint{padding:6px 20px 0 20px;font-size:13px;color:var(--ink-3)}

/* ---------- add to Home Screen */
.install{min-height:100%;display:grid;align-content:center;gap:22px;padding:32px 28px}
.install img{width:84px;height:84px;border-radius:19px;justify-self:center}
.install h1{font-size:28px;line-height:1.14;font-weight:300;text-align:center;text-wrap:balance}
.install ol{display:grid;gap:10px;padding-left:24px;font-size:17px;line-height:1.35;list-style:decimal}
.install .help{font-size:15px;line-height:1.4;color:var(--ink-2)}
.install .quiet{justify-self:center}

/* ---------- sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);opacity:0;transition:opacity .22s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;max-height:88%;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:22px 22px 0 0;padding:6px 0 calc(14px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.open>.scrim{opacity:1}
.open>.sheet{transform:none}
.sheet .head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:6px 10px 2px 24px}
.sheet .head h2{font-size:21px;font-weight:500}
.item{display:grid;gap:1px;width:100%;padding:13px 24px;cursor:pointer}
.item:active{background:var(--fill)}
.item .l{font-size:17px}
.item .s{font-size:13px;color:var(--ink-2)}
.item.danger .l{color:#d0342c}
.item:disabled{opacity:.4;cursor:default}
.sheet .form{display:grid;gap:12px;padding:8px 24px 6px}
.sheet .form label.lb{font-size:13px;color:var(--ink-2);margin:4px 0 -6px 2px}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:40px;border-radius:20px;background:var(--fill);font-size:15px;text-align:center;display:grid;place-items:center}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:500}
.seg.cat button span{display:inline-flex;align-items:center;gap:7px}
.seg.cat .dot{width:9px;height:9px;border-radius:5px}
.seg.cat button[aria-pressed=true] .dot{box-shadow:0 0 0 1.5px var(--bg)}
.seg.days button{font-variant-numeric:tabular-nums}
.sheet .foot{padding:12px 24px 4px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.sheet .actions{display:grid;gap:8px;padding:6px 24px 2px}
.about{margin-top:8px;padding:16px 24px 4px;border-top:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--ink-2)}

/* ---------- toast */
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:40;width:max-content;max-width:calc(100% - 48px);padding:10px 18px;border-radius:21px;background:var(--ink);color:var(--bg);font-size:15px;line-height:1.3;text-align:center;opacity:0;transform:translate(-50%,-10px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections">
    <button type="button" data-tab="cal"><svg viewBox="0 0 26 26" aria-hidden="true"><rect class="f" x="4" y="5.5" width="18" height="16" rx="3"/><path d="M4 10.5h18M9 3.5v4M17 3.5v4"/><circle cx="9" cy="15.5" r="1" fill="currentColor"/></svg><span>Calendar</span></button>
    <button type="button" data-tab="rou"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M5 13a8 8 0 0 1 13.5-5.8"/><path d="M18.5 3.6v3.6h-3.6"/><path class="f" d="M21 13a8 8 0 0 1-13.5 5.8"/><path d="M7.5 22.4v-3.6h3.6"/></svg><span>Weekly</span></button>
    <button type="button" data-tab="mon"><svg viewBox="0 0 26 26" aria-hidden="true"><rect class="f" x="4" y="5.5" width="18" height="16" rx="3"/><path d="M4 10.5h18M9 3.5v4M17 3.5v4"/><path d="M8 14.5h2M12 14.5h2M16 14.5h2M8 18h2M12 18h2" stroke-width="1.8"/></svg><span>Monthly</span></button>
    <button type="button" data-tab="list"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M9.5 7h12M9.5 13h12M9.5 19h12"/><circle class="f" cx="4.8" cy="7" r="1.4"/><circle class="f" cx="4.8" cy="13" r="1.4"/><circle class="f" cx="4.8" cy="19" r="1.4"/></svg><span>List</span></button>
    <button type="button" data-tab="spec"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M13 3.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L13 18.4l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg><span>Special</span></button>
  </nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="pick" class="sr" type="file" accept=".json,application/json,text/plain" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

const APP = 'To-Do';
const BACKUP_NAME = 'To-Do backup.json';

/* ================================================================== helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const wait = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const arr = v => Array.isArray(v) ? v : [];
const CATS = { p: 'Personal', w: 'Work' };
const catOf = v => v === 'p' || v === 'w' ? v : null;

// Days are plain 'YYYY-MM-DD' strings in the phone's own time zone.
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const dateOf = day => { const [y, m, d] = day.split('-').map(Number); return new Date(y, m - 1, d); };
const dayOf = d => iso(d.getFullYear(), d.getMonth() + 1, d.getDate());
const today = () => dayOf(new Date());
const addDays = (day, n) => { const d = dateOf(day); d.setDate(d.getDate() + n); return dayOf(d); };
const dowOf = day => dateOf(day).getDay();   // 0 is Sunday
const validDay = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !isNaN(dateOf(s));
const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const WEEK = [1, 2, 3, 4, 5, 6, 0];   // the Weekly tab runs Monday to Sunday
const domOf = day => +day.slice(8, 10);
const daysInMonth = day => new Date(+day.slice(0, 4), +day.slice(5, 7), 0).getDate();
const DOMS = Array.from({ length: 31 }, (_, i) => i + 1);
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
// A monthly item falls on its day of the month; the 31st falls on the last day of a shorter month.
const onDom = (m, day) => m.dom === domOf(day) || (m.dom > daysInMonth(day) && domOf(day) === daysInMonth(day));
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const longFmt = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const shortFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const dayFmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
const fmtLong = day => longFmt.format(dateOf(day));
const fmtShort = day => shortFmt.format(dateOf(day));
const fmtDay = day => dayFmt.format(dateOf(day));
const relative = day => { const t = today(); return day === t ? 'Today' : day === addDays(t, 1) ? 'Tomorrow' : ''; };

const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.4 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.3 9.6l6-.9z"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 9h10M7 15h10"/></svg>',
};

/* ================================================================== storage
   Everything stays in this phone's storage for the Home Screen app. */
const K = { tasks: 'todo.tasks', routine: 'todo.routine', monthly: 'todo.monthly', sections: 'todo.sections', special: 'todo.special', routineDone: 'todo.routineDone', days: 'todo.days', meta: 'todo.meta', skip: 'todo.skipInstall', seeded: 'todo.seeded' };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
let tasks = arr(LS.get(K.tasks, []));         // dated items and list items (a list item may also carry a date)
let routine = arr(LS.get(K.routine, []));     // weekly items: dow 0 to 6; a divider is one with divider: true
let monthly = arr(LS.get(K.monthly, []));     // monthly items: dom 1 to 31
let sections = arr(LS.get(K.sections, []));   // the List tab's groups
let special = arr(LS.get(K.special, []));     // yearly dates
let routineDone = LS.get(K.routineDone, {}) || {};   // 'routineId|day' or 'monthlyId|day': true
let days = LS.get(K.days, {}) || {};                 // day -> { order: ['r:id|day', 't:id', ...], moved: {} }; moved lives under the day the routine item usually falls on: { 'routineId|day': newDay }
const dayInfo = day => days[day] || (days[day] = {});
let meta = Object.assign({ unsaved: 0, lastBackup: null }, LS.get(K.meta, {}));

const full = () => toast('Couldn’t save on this phone. Its storage may be full.');
function persist(changes = 0) {
  const ok = LS.set(K.tasks, tasks) && LS.set(K.routine, routine) && LS.set(K.monthly, monthly) && LS.set(K.sections, sections) && LS.set(K.special, special) && LS.set(K.routineDone, routineDone) && LS.set(K.days, days);
  if (!ok) full();
  if (changes) { meta.unsaved = (meta.unsaved || 0) + changes; LS.set(K.meta, meta); }
}
const taskById = id => tasks.find(t => t.id === id);
const routineById = id => routine.find(t => t.id === id);
const monthlyById = id => monthly.find(t => t.id === id);
const isDivider = id => { const r = routineById(id); return !!(r && r.divider); };
const specialById = id => special.find(t => t.id === id);
const sectionById = id => sections.find(s => s.id === id);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);

/* ================================================================== the yearly dates
   Holidays follow rules (the third Monday of January); birthdays are a month and a day. */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return iso(y, mo, da);
}
function nthDow(y, m, dow, n) {
  if (n > 0) { const first = new Date(y, m - 1, 1).getDay(); return iso(y, m, 1 + ((dow - first + 7) % 7) + (n - 1) * 7); }
  const lastDay = new Date(y, m, 0).getDate(), last = new Date(y, m - 1, lastDay).getDay();
  return iso(y, m, lastDay - ((last - dow + 7) % 7));
}
// When a fixed holiday lands on a weekend the market closes on the nearest weekday, never in the previous year.
function observed(day) {
  const dow = dowOf(day);
  if (dow === 6) { const fri = addDays(day, -1); return fri.slice(0, 4) === day.slice(0, 4) ? fri : day; }
  if (dow === 0) return addDays(day, 1);
  return day;
}
// Everything a yearly item puts on the calendar in one year: [{ day, text, note }]
function occurrences(it, y) {
  const r = it.rule || {};
  let day = null;
  if (r.kind === 'nth') day = nthDow(y, r.m, r.dow, r.n);
  else if (r.kind === 'easter') day = addDays(easter(y), r.offset || 0);
  else { const m = it.m || r.m, d = it.d || r.d; if (!m || !d) return []; const last = new Date(y, m, 0).getDate(); day = iso(y, m, Math.min(d, last)); }
  const note = it.market ? 'Market closed' : '';
  if (!it.market || r.kind === 'nth' || r.kind === 'easter') return [{ day, text: it.text, note }];
  const obs = observed(day);
  if (obs === day) return [{ day, text: it.text, note }];
  return [{ day, text: it.text, note: '' }, { day: obs, text: `${it.text} (observed)`, note }];
}
function nextOccurrence(it, from) {
  const y = +from.slice(0, 4);
  for (const yy of [y, y + 1]) { const o = occurrences(it, yy).find(x => x.day >= from); if (o) return o; }
  return null;
}
const ruleText = it => {
  const r = it.rule || {};
  const nth = ['', 'First', 'Second', 'Third', 'Fourth'];
  if (r.kind === 'nth') return `${r.n < 0 ? 'Last' : nth[r.n]} ${DOW[r.dow]} of ${MONTHS[r.m - 1]}`;
  if (r.kind === 'easter') return r.offset === -2 ? 'The Friday before Easter' : 'Set by Easter';
  return `${MONTHS[(it.m || r.m) - 1]} ${it.d || r.d}, every year`;
};
const MARKET_HOLIDAYS = [
  { text: 'New Year’s Day', m: 1, d: 1 },
  { text: 'Martin Luther King Jr. Day', rule: { kind: 'nth', m: 1, dow: 1, n: 3 } },

  { text: 'Good Friday', rule: { kind: 'easter', offset: -2 } },

  { text: 'Juneteenth', m: 6, d: 19 },

];
if (!LS.get(K.seeded, false)) {   // the first run starts with the days the stock market is closed

}

}

/* ================================================================== navigation */
const viewEl = $('#view');
const homes = { cal: { name: 'cal', weeks: 4 }, rou: { name: 'rou' }, mon: { name: 'mon' }, list: { name: 'list' }, spec: { name: 'spec' } };
const state = { tab: 'cal' };
const top = () => homes[state.tab];
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const needsInstall = () => isIOS() && !standalone() && !LS.get(K.skip, false);

function render(keepScroll) {
  const page = top();
  if (keepScroll) page.scroll = viewEl.scrollTop;
  const name = needsInstall() ? 'install' : page.name;
  document.body.dataset.view = name;
  for (const b of $$('#tabs button')) { if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }
  VIEWS[name](page);
  viewEl.scrollTop = page.scroll || 0;
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  if (b.dataset.tab === state.tab) { viewEl.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  homes[b.dataset.tab].scroll = 0;
  state.tab = b.dataset.tab;
  render();
});

const sheets = $('#sheets');
let sheetTurn = 0;
function openSheet(html, mount) {
  const turn = ++sheetTurn;
  sheets.classList.remove('open');
  sheets.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  $('.scrim', sheets).addEventListener('click', () => closeSheet());
  const el = $('.sheet', sheets);
  for (const x of $$('[data-close]', el)) x.addEventListener('click', () => closeSheet());
  if (mount) mount(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { if (turn === sheetTurn) sheets.classList.add('open'); }));
}
function closeSheet(now) {
  if (!sheets.firstChild) return;
  const turn = ++sheetTurn;
  sheets.classList.remove('open');
  if (now) sheets.innerHTML = ''; else setTimeout(() => { if (turn === sheetTurn) sheets.innerHTML = ''; }, 320);
}
const head = title => `<div class="head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>`;
// A destructive action takes two taps.
function arm(btn, label, fn) {
  let armed = 0;
  btn.addEventListener('click', () => {
    if (Date.now() - armed < 4000) return fn();
    armed = Date.now(); const l = $('.l', btn) || btn; const was = l.textContent; l.textContent = `Tap again to ${label}`;
    setTimeout(() => { if (btn.isConnected) l.textContent = was; }, 4000);

}
// A row of choices that behaves like a radio group.
function segHTML(name, options, value, cls = '') {

}
function wireSeg(el, name, onChange) {
  const seg = $(`[data-seg="${name}"]`, el);
  seg.addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; for (const x of $$('button', seg)) x.setAttribute('aria-pressed', String(x === b)); if (onChange) onChange(b.dataset.v); });

}
const catSeg = value => segHTML('cat', [['', '<span>None</span>'], ['p', '<span><i class="dot p"></i>Personal</span>'], ['w', '<span><i class="dot w"></i>Work</span>']], value || '', 'cat');

// Hands a file to the iPhone share sheet (Save to Files, then OneDrive). Falls back to a plain download.
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  return 'downloaded';
}

/* ================================================================== rows */
function rowHTML(it, { kind, day = '', done = false, drag = true, right = '', sub = '', check = true, rec = false } = {}) {

  if (it.divider) return `<li class="row divider" data-id="${esc(it.id)}" data-kind="${kind}"${day ? ` data-day="${day}"` : ''}${drag ? ' data-drag' : ''}>

  return `<li class="row${done ? ' done' : ''}${rec ? ' rec' : ''}" data-id="${esc(it.id)}" data-kind="${kind}"${day ? ` data-day="${day}"` : ''}${drag ? ' data-drag' : ''}>
    ${kind === 'special' ? `<span class="star">${ICON.star}</span>` : !check ? '<span></span>' : `<button type="button" class="ck" aria-pressed="${done}" aria-label="${done ? 'Done: ' : 'Not done: '}${esc(it.text)}"><i>${ICON.check}</i></button>`}
    <i class="dot ${it.cat || 'n'}"></i>

    <span class="r${done ? '' : ' d'}">${esc(right)}</span>

}
const plusBtn = (attrs, label) => `<button type="button" class="plus" ${attrs} aria-label="${esc(label)}">${ICON.plus}</button>`;

/* ================================================================== hold and drag
   Hold a row for a moment, then move it; it can land in any list of the same page. */
function enableDrag(root, onDrop) {
  let press = null, drag = null, raf = 0, dropped = 0;
  const prevent = e => { if (drag) e.preventDefault(); };
  root.addEventListener('click', e => { if (Date.now() - dropped < 500) { e.stopPropagation(); e.preventDefault(); } }, true);   // letting go is not a tap
  root.addEventListener('pointerdown', e => {
    const row = e.target.closest('.row[data-drag]');
    if (!row || e.button || e.target.closest('.ck') || drag) return;
    press = { row, x: e.clientX, y: e.clientY, id: e.pointerId, timer: 0 };
    if (e.target.closest('.hd')) { e.preventDefault(); lift(); }   // the grip: no wait
    else press.timer = setTimeout(lift, 300);                        // anywhere else: a short hold first
  });
  const cancel = () => { if (press) { clearTimeout(press.timer); press = null; } };
  root.addEventListener('pointermove', e => {
    if (press && !drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) cancel();
    if (drag && e.pointerId === drag.id) move(e);
  });
  root.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) drop(true); cancel(); });
  root.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) drop(false); cancel(); });   // the browser took the touch: put the row back
  root.addEventListener('contextmenu', e => { if (e.target.closest('.row[data-drag]')) e.preventDefault(); });
  function lift() {
    const row = press.row, box = row.getBoundingClientRect();
    drag = { row, id: press.id, dx: press.x - box.left, dy: press.y - box.top, x: press.x, y: press.y, from: (row.closest('[data-list]') || { dataset: {} }).dataset.list };
    try { row.setPointerCapture(press.id); } catch { /* not a pointer we can hold */ }
    const ghost = document.createElement('div');
    ghost.className = 'ghost'; ghost.style.width = box.width + 'px';
    ghost.innerHTML = row.outerHTML;
    document.body.append(ghost);
    drag.ghost = ghost;
    row.classList.add('lifting');
    document.body.classList.add('dragging');
    document.addEventListener('touchmove', prevent, { passive: false });
    if (navigator.vibrate) navigator.vibrate(8);
    press = null;
    place(drag.x, drag.y);
    raf = requestAnimationFrame(scrollLoop);
  }
  function place(x, y) { drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px'; }
  function move(e) {
    drag.x = e.clientX; drag.y = e.clientY;
    place(e.clientX, e.clientY);
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !root.contains(el)) return;
    const over = el.closest('.row[data-drag]');
    if (over && over !== drag.row) {
      const b = over.getBoundingClientRect();
      if (e.clientY < b.top + b.height / 2) over.before(drag.row); else over.after(drag.row);
      return;
    }
    const list = el.closest('.rows') || ((el.closest('.sec') || el.closest('[data-list]')) && $('.rows', el.closest('[data-list]')));
    if (list && !list.contains(drag.row)) {   // over a heading or an empty list: join that list
      const b = list.getBoundingClientRect();
      if (e.clientY < b.top + b.height / 2) list.prepend(drag.row); else list.append(drag.row);
    }
  }
  function scrollLoop() {   // the list scrolls when the row is held near the top or bottom edge
    if (!drag) return;
    const b = viewEl.getBoundingClientRect(), edge = 70;
    if (drag.y < b.top + edge) viewEl.scrollTop -= Math.ceil((b.top + edge - drag.y) / 6);
    else if (drag.y > b.bottom - edge) viewEl.scrollTop += Math.ceil((drag.y - (b.bottom - edge)) / 6);
    raf = requestAnimationFrame(scrollLoop);
  }
  function drop(keep) {
    cancelAnimationFrame(raf);
    const row = drag.row, from = drag.from;
    drag.ghost.remove();
    row.classList.remove('lifting');
    document.body.classList.remove('dragging');
    document.removeEventListener('touchmove', prevent);
    drag = null; dropped = Date.now();
    if (keep) onDrop(row, from); else render(true);
  }
}
// Tick a row: it shows as done for a moment (tap again if it was a slip), then slides away for good.
const ticks = new Map();   // row id -> timer
function tickRow(row, set, finish) {
  const id = row.dataset.id + '|' + (row.dataset.day || '');
  if (ticks.has(id)) { clearTimeout(ticks.get(id)); ticks.delete(id); set(false); row.classList.remove('done'); $('.ck', row).setAttribute('aria-pressed', 'false'); persist(); return; }
  set(true); row.classList.add('done'); $('.ck', row).setAttribute('aria-pressed', 'true'); persist(1);
  ticks.set(id, setTimeout(() => {
    ticks.delete(id);
    finish(); persist();
    row.classList.add('bye');
    setTimeout(() => { if (row.isConnected) row.remove(); }, 300);
  }, 1000));
}
// After a drop, read the lists back from the page: which list each row sits in and in what order.
const readLists = root => $$('[data-list]', root).map(sec => ({ key: sec.dataset.list, ids: $$('.row[data-drag]', sec).map(r => r.dataset.id), rows: $$('.row[data-drag]', sec).map(r => ({ id: r.dataset.id, kind: r.dataset.kind, day: r.dataset.day || '' })) }));

/* ================================================================== screens */
const VIEWS = {

  install() {
    viewEl.innerHTML = `<section class="install">
      <img src="apple-touch-icon.png" alt="">
      <h1>Add ${APP} to your Home Screen first</h1>
      <ol>
        <li>Tap the Share button in Safari.</li>
        <li>Tap Add to Home Screen. If it isn’t listed, tap View More.</li>
        <li>Keep Open as Web App on, then tap Add.</li>
      </ol>
      <p class="help">Then open ${APP} from your Home Screen. The Home Screen app keeps its own lists, separate from Safari, so anything you add here would not follow you.</p>
      <button type="button" class="quiet" id="skip">Use it in Safari anyway</button>
    </section>`;
    $('#skip').addEventListener('click', () => { LS.set(K.skip, true); render(); });
  },

  /* ---------------- Calendar: the coming days, each with its yearly dates, routine and items */
  cal(page) {
    const t = today(), span = Array.from({ length: page.weeks * 7 }, (_, i) => addDays(t, i));
    const years = [...new Set(span.map(d => +d.slice(0, 4)))];
    const specials = {};   // day -> occurrences
    for (const it of special.slice().sort(byOrder)) for (const y of years) for (const o of occurrences(it, y)) (specials[o.day] = specials[o.day] || []).push({ ...it, text: o.text, note: o.note });
    const dated = tasks.filter(x => x.date && !x.done);
    const overdue = dated.filter(x => x.date < t).sort((a, b) => a.date.localeCompare(b.date) || byOrder(a, b));
    // A weekly item sits on its weekday, a monthly item on its day of the month, unless it was moved for that once; either can be ticked off where it shows.
    const movedTo = (it, from) => ((days[from] || {}).moved || {})[`${it.id}|${from}`] || null;
    const usual = (kind, it, from) => kind === 'routine' ? `Usually ${DOW[dowOf(from)]}` : `Usually the ${ordinal(it.dom)}`;
    const recurringRows = day => {
      const here = [];
      for (const r of routine.slice().sort(byOrder)) if (r.dow === dowOf(day) && !routineDone[`${r.id}|${day}`] && !movedTo(r, day)) here.push({ kind: 'routine', it: r, from: day });
      for (const m of monthly.slice().sort(byOrder)) if (onDom(m, day) && !routineDone[`${m.id}|${day}`] && !movedTo(m, day)) here.push({ kind: 'monthly', it: m, from: day });
      for (const [from, info] of Object.entries(days)) for (const [k, to] of Object.entries(info.moved || {})) {   // moved here from another day
        if (to !== day) continue;
        const [id, origin] = k.split('|'); if (origin !== from || routineDone[k]) continue;
        const r = routineById(id), m = monthlyById(id);
        if (r && r.dow === dowOf(from)) here.push({ kind: 'routine', it: r, from });
        else if (m && onDom(m, from)) here.push({ kind: 'monthly', it: m, from });
      }
      return here.map(({ kind, it, from }) => rowHTML(it, { kind, day: from, rec: true, sub: from === day ? '' : usual(kind, it, from) }));
    };
    // With no order of its own, a day runs weekly and monthly items, then its dated items; a divider that ends its weekday's Weekly list goes last of all.
    const defaultOrder = (day, recurring, dated) => {
      const list = routine.filter(r => r.dow === dowOf(day)).sort(byOrder), tail = list.length && list[list.length - 1].divider ? list[list.length - 1].id : null;
      const isTail = h => tail && h.includes(`data-id="${tail}"`) && h.includes('class="row divider"');
      return [...recurring.filter(h => !isTail(h)), ...dated, ...recurring.filter(isTail)];
    };
    const arrange = (day, html) => {   // the order this day was put in, if it was; anything new goes last
      const order = (days[day] || {}).order;
      if (!order || !order.length) return html;
      const key = h => { const kind = h.match(/data-kind="(\w+)"/)[1], id = h.match(/data-id="([^"]+)"/)[1], from = (h.match(/data-day="([^"]+)"/) || [])[1]; return kind === 'routine' ? `r:${id}|${from}` : kind === 'monthly' ? `m:${id}|${from}` : `t:${id}`; };
      const at = h => { const i = order.indexOf(key(h)); return i < 0 ? 1e9 : i; };
      return html.map((h, i) => ({ h, i, at: at(h) })).sort((a, b) => a.at - b.at || a.i - b.i).map(x => x.h);
    };
    const dayHTML = day => {
      const rel = relative(day);
      const items = [
        ...(specials[day] || []).map(s => rowHTML(s, { kind: 'special', day, drag: false })),
        ...arrange(day, defaultOrder(day, recurringRows(day), dated.filter(x => x.date === day).sort(byOrder).map(x => rowHTML(x, { kind: 'task', day })))),
      ];
      return `<section class="day" data-list="${day}">
        <div class="sec${rel === 'Today' ? ' today' : ''}"><span class="nm">${esc(fmtLong(day))}</span>${rel ? `<span class="tag">${rel}</span>` : ''}${plusBtn(`data-add="${day}"`, `Add to ${fmtLong(day)}`)}</div>
        <ul class="rows">${items.join('')}</ul>
      </section>`;
    };
    viewEl.innerHTML = `<section class="page cal">
      <header class="bar"><button type="button" class="icon-btn" id="more" aria-label="Backup and settings">${ICON.more}${meta.unsaved ? '<i class="dot"></i>' : ''}</button><h2>Calendar</h2><button type="button" class="icon-btn" id="add" aria-label="Add an item">${ICON.plus}</button></header>
      ${overdue.length ? `<section class="day" data-list="overdue"><div class="sec over"><span class="nm">Overdue</span><span class="ct">${overdue.length}</span></div><ul class="rows">${overdue.map(x => rowHTML(x, { kind: 'task', day: x.date, right: fmtDay(x.date) })).join('')}</ul></section>` : ''}
      ${span.map(dayHTML).join('')}
      <button type="button" class="quiet more-btn" id="moreDays">Show 4 more weeks</button>
    </section>`;
    const body = $('.cal');
    $('#more').addEventListener('click', moreSheet);
    $('#add').addEventListener('click', () => addSheet({ kind: 'task', date: t }));
    $('#moreDays').addEventListener('click', () => { page.weeks += 4; render(true); });
    body.addEventListener('click', e => {
      const add = e.target.closest('[data-add]');
      if (add) return addSheet({ kind: 'task', date: add.dataset.add });
      const row = e.target.closest('.row'); if (!row) return;
      const { id, kind, day } = row.dataset;
      if (e.target.closest('.ck')) {
        if (kind === 'task') { const x = taskById(id); if (x) tickRow(row, on => { x.done = on; }, () => { tasks = tasks.filter(t => t.id !== id); }); }
        else if (kind === 'routine' || kind === 'monthly') { const key = `${id}|${day}`; tickRow(row, on => { if (on) routineDone[key] = true; else delete routineDone[key]; }, () => {}); }
        return;
      }
      if (e.target.closest('.tx')) {
        if (kind === 'task') editTask(id);
        else if (kind === 'routine') { if (isDivider(id)) dividerSheet(id, day); else editRoutine(id); }
        else if (kind === 'monthly') editMonthly(id);
        else editSpecial(id);
      }
    });
    enableDrag(body, (row, fromKey) => {   // a dropped row takes the day it landed in; that day, and the one it left, keep their new order
      const toKey = (row.closest('[data-list]') || { dataset: {} }).dataset.list;
      if (isDivider(row.dataset.id) && toKey !== fromKey) { render(true); return; }   // a divider stays on its own day: nothing changes
      for (const { key: day, rows } of readLists(body)) {
        if (day !== toKey && day !== fromKey) continue;
        rows.forEach(({ id, kind, day: from }, i) => {
          if (kind === 'task') { const x = taskById(id); if (x) { if (day !== 'overdue') x.date = day; x.order = i; } }
          else if ((kind === 'routine' || kind === 'monthly') && day !== 'overdue') {
            const info = dayInfo(from), k = `${id}|${from}`;
            if (day === from) { if (info.moved) { delete info.moved[k]; if (!Object.keys(info.moved).length) delete info.moved; } }
            else (info.moved || (info.moved = {}))[k] = day;
          }
        });
        if (day !== 'overdue') dayInfo(day).order = rows.map(r => r.kind === 'routine' ? `r:${r.id}|${r.day}` : r.kind === 'monthly' ? `m:${r.id}|${r.day}` : `t:${r.id}`);
      }
      persist(1); render(true);
    });
  },

  /* ---------------- Weekly: Monday to Sunday, every week */
  rou() {
    viewEl.innerHTML = `<section class="page rou">
      <header class="bar"><button type="button" class="icon-btn" id="more" aria-label="Backup and settings">${ICON.more}${meta.unsaved ? '<i class="dot"></i>' : ''}</button><h2>Weekly</h2><button type="button" class="icon-btn" id="add" aria-label="Add a weekly item">${ICON.plus}</button></header>
      ${routine.some(r => !r.divider) ? '' : '<p class="note">Things you do every week, like Gym on Monday or Trash out on Thursday. They show up on the Calendar under every one of those days, in grey italics. The drive dividers are here too, so you can move or delete them.</p>'}
      ${WEEK.map(d => `<section class="day" data-list="${d}">
        <div class="sec"><span class="nm">${DOW[d]}</span>${plusBtn(`data-add="${d}"`, `Add to ${DOW[d]}`)}</div>

  /* ---------------- Monthly: the 1st to the 31st, every month */
  mon() {
    viewEl.innerHTML = `<section class="page mon">
      <header class="bar"><button type="button" class="icon-btn" id="more" aria-label="Backup and settings">${ICON.more}${meta.unsaved ? '<i class="dot"></i>' : ''}</button><h2>Monthly</h2><button type="button" class="icon-btn" id="add" aria-label="Add a monthly item">${ICON.plus}</button></header>
      ${monthly.length ? '' : '<p class="note">Things that come round every month, like Rent on the 1st or Expenses on the 25th. They show up on the Calendar on that day of every month, in grey italics. The 31st falls on the last day of shorter months.</p>'}
      ${DOMS.map(d => `<section class="day" data-list="${d}">
        <div class="sec"><span class="nm">${ordinal(d)}</span>${plusBtn(`data-add="${d}"`, `Add to the ${ordinal(d)}`)}</div>
        <ul class="rows">${monthly.filter(m => m.dom === d).sort(byOrder).map(m => rowHTML(m, { kind: 'monthly', drag: true, check: false })).join('')}</ul>
      </section>`).join('')}
    </section>`;
    const body = $('.mon');
    $('#more').addEventListener('click', moreSheet);
    $('#add').addEventListener('click', () => addSheet({ kind: 'monthly', dom: 1 }));
    body.addEventListener('click', e => {
      const add = e.target.closest('[data-add]');

    });

      persist(1); render(true);
    });
  },

  /* ---------------- List: plain items, with sections if you want them */
  list() {
    const secs = sections.slice().sort(byOrder);
    const rows = sid => tasks.filter(x => x.onList && !x.done && (x.section || null) === sid).sort(byOrder)
      .map(x => rowHTML(x, { kind: 'task', right: x.date ? (x.date < today() ? 'Overdue' : fmtDay(x.date)) : '' })).join('');
    const hasAny = tasks.some(x => x.onList && !x.done);
    viewEl.innerHTML = `<section class="page lst">
      <header class="bar"><button type="button" class="icon-btn" id="more" aria-label="Backup and settings">${ICON.more}${meta.unsaved ? '<i class="dot"></i>' : ''}</button><h2>List</h2><button type="button" class="icon-btn" id="add" aria-label="Add to the list">${ICON.plus}</button></header>
      ${hasAny || secs.length ? '' : '<p class="note">Anything you want to get to, in any order. Hold an item to move it. An item can be put on the Calendar from its page.</p>'}
      <section class="day" data-list=""><ul class="rows">${rows(null)}</ul></section>
      ${secs.map(s => `<section class="day" data-list="${esc(s.id)}">
        <div class="sec"><button type="button" class="secname" data-section="${esc(s.id)}">${esc(s.name)}</button>${plusBtn(`data-add="${esc(s.id)}"`, `Add to ${s.name}`)}</div>
        <ul class="rows">${rows(s.id)}</ul>
      </section>`).join('')}
      <button type="button" class="quiet more-btn" id="newsec">New section</button>
    </section>`;
    const body = $('.lst');

    $('#add').addEventListener('click', () => addSheet({ kind: 'list', section: null }));
    $('#newsec').addEventListener('click', () => sectionSheet(null));
    body.addEventListener('click', e => {
      const add = e.target.closest('[data-add]');
      if (add) return addSheet({ kind: 'list', section: add.dataset.add || null });
      const sn = e.target.closest('[data-section]');
      if (sn) return sectionSheet(sn.dataset.section);
      const row = e.target.closest('.row'); if (!row) return;
      const x = taskById(row.dataset.id); if (!x) return;
      if (e.target.closest('.ck')) { tickRow(row, on => { x.done = on; }, () => { tasks = tasks.filter(t => t.id !== x.id); }); return; }
      if (e.target.closest('.tx')) editTask(x.id);
    });
    enableDrag(body, () => {
      for (const { key, ids } of readLists(body)) ids.forEach((id, i) => { const x = taskById(id); if (x) { x.section = key || null; x.order = i; } });

  /* ---------------- Special: the dates that come round every year, next one first */
  spec() {
    const t = today();
    const upcoming = special.map(it => ({ it, next: nextOccurrence(it, t) })).filter(x => x.next).sort((a, b) => a.next.day.localeCompare(b.next.day) || byOrder(a.it, b.it));
    let body = '', month = '';
    for (const { it, next } of upcoming) {
      const m = `${MONTHS[+next.day.slice(5, 7) - 1]}${next.day.slice(0, 4) !== t.slice(0, 4) ? ' ' + next.day.slice(0, 4) : ''}`;
      if (m !== month) { month = m; body += `${month !== '' && body ? '</ul></section>' : ''}<section class="day"><div class="sec"><span class="nm">${esc(m)}</span></div><ul class="rows">`; }
      body += rowHTML({ ...it, text: next.text, note: next.note }, { kind: 'special', drag: false, right: fmtShort(next.day) });
    }
    if (body) body += '</ul></section>';
    viewEl.innerHTML = `<section class="page spc">
      <header class="bar"><button type="button" class="icon-btn" id="more" aria-label="Backup and settings">${ICON.more}${meta.unsaved ? '<i class="dot"></i>' : ''}</button><h2>Special</h2><button type="button" class="icon-btn" id="add" aria-label="Add a yearly date">${ICON.plus}</button></header>
      ${body || '<p class="note">Birthdays, anniversaries, holidays: dates that come round every year. They show up on the Calendar when they are due.</p>'}
    </section>`;
    $('#more').addEventListener('click', moreSheet);
    $('#add').addEventListener('click', () => addSheet({ kind: 'special', date: t }));
    $('.spc').addEventListener('click', e => { const row = e.target.closest('.row'); if (row && e.target.closest('.tx')) editSpecial(row.dataset.id); });
  },
};

/* ================================================================== adding and editing */
const sectionOptions = value => `<select class="field" data-k="section" aria-label="Section"><option value="">No section</option>${sections.slice().sort(byOrder).map(s => `<option value="${esc(s.id)}"${s.id === value ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`;

// One sheet adds an item of any kind: what it says, its category, and where it goes.
function addSheet(o) {
  const title = { task: 'Add to the Calendar', routine: 'Add to Weekly', monthly: 'Add to Monthly', list: 'Add to the List', special: 'Add a yearly date' }[o.kind];
  openSheet(`${head(title)}<form class="form" id="f" autocomplete="off">
      ${o.kind === 'routine' ? segHTML('type', [['item', 'Item'], ['divider', 'Divider']], 'item') : ''}
      <input class="field" type="text" data-k="text" placeholder="${o.kind === 'special' ? 'Mum’s birthday' : 'What is it?'}" autocapitalize="sentences" enterkeyhint="done" aria-label="Item">
      ${catSeg('')}
      ${o.kind === 'task' ? `<input class="field" type="date" data-k="date" value="${o.date}" aria-label="Date">` : ''}
      ${o.kind === 'routine' ? `<label class="lb">Every</label>${daySeg(o.dow)}` : ''}
      ${o.kind === 'monthly' ? `<label class="lb">Every month on the</label>${domSelect(o.dom)}` : ''}
      ${o.kind === 'list' && sections.length ? sectionOptions(o.section) : ''}
      ${o.kind === 'special' ? `<label class="lb">On (the year doesn’t matter)</label><input class="field" type="date" data-k="date" value="${o.date}" aria-label="Date">` : ''}
      <button type="submit" class="primary">Add</button>
    </form>`, el => {
    const f = $('#f', el), text = $('[data-k=text]', f);
    const cat = wireSeg(el, 'cat');
    const dow = o.kind === 'routine' ? wireSeg(el, 'dow') : null;
    const type = o.kind === 'routine' ? wireSeg(el, 'type', v => { $('[data-seg=cat]', el).hidden = v === 'divider'; text.placeholder = v === 'divider' ? 'Lunch' : 'What is it?'; }) : null;
    setTimeout(() => text.focus(), 350);
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = text.value.trim();
      if (!v) { text.focus(); return; }
      const c = catOf(cat());
      if (o.kind === 'task' || o.kind === 'list') {
        const date = o.kind === 'task' ? $('[data-k=date]', f).value : null;
        if (o.kind === 'task' && !validDay(date)) { toast('Pick a date.'); return; }
        const sec = o.kind === 'list' ? (($('[data-k=section]', f) || {}).value || o.section || null) : null;
        tasks.push({ id: 't' + uid(), text: v, cat: c, date: date || null, onList: o.kind === 'list', section: sec, order: tasks.length + 1, done: false, created: new Date().toISOString() });
      } else if (o.kind === 'routine') {
        if (type() === 'divider') routine.push({ id: 'd' + uid(), text: v, dow: +dow(), divider: true, order: routine.length + 1 });
        else routine.push({ id: 'r' + uid(), text: v, cat: c, dow: +dow(), order: routine.length + 1 });
      } else if (o.kind === 'monthly') {
        monthly.push({ id: 'm' + uid(), text: v, cat: c, dom: +$('[data-k=dom]', f).value, order: monthly.length + 1 });
      } else {
        const date = $('[data-k=date]', f).value;
        if (!validDay(date)) { toast('Pick a date.'); return; }
        special.push({ id: 's' + uid(), text: v, cat: c, m: +date.slice(5, 7), d: +date.slice(8, 10), rule: null, market: false, order: special.length + 1 });
      }
      persist(1); closeSheet(); render(true);
    });
  });
}

function editTask(id) {
  const x = taskById(id); if (!x) return;
  openSheet(`${head(x.onList ? 'List item' : 'Calendar item')}<form class="form" id="f" autocomplete="off">
      <input class="field" type="text" data-k="text" value="${esc(x.text)}" autocapitalize="sentences" enterkeyhint="done" aria-label="Item">
      ${catSeg(x.cat)}
      ${x.onList ? `${sections.length ? sectionOptions(x.section) : ''}<label class="lb">${x.date ? 'On the Calendar' : 'Put it on the Calendar'}</label><input class="field" type="date" data-k="date" value="${x.date || ''}" aria-label="Date">`
        : `<input class="field" type="date" data-k="date" value="${esc(x.date || '')}" aria-label="Date">`}
      <button type="submit" class="primary">Save</button>
    </form>
    <div class="actions">
      ${x.onList && x.date ? '<button type="button" class="item" id="undate"><span class="l">Take it off the Calendar</span><span class="s">It stays on the List</span></button>' : ''}
      <button type="button" class="item danger" id="del"><span class="l">Delete</span></button>
    </div>`, el => {
    const f = $('#f', el), cat = wireSeg(el, 'cat');
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = $('[data-k=text]', f).value.trim(); if (!v) return;
      const date = $('[data-k=date]', f).value;
      if (!x.onList && !validDay(date)) { toast('Pick a date.'); return; }
      const sel = $('[data-k=section]', f);
      Object.assign(x, { text: v, cat: catOf(cat()), date: validDay(date) ? date : null, section: sel ? sel.value || null : x.section });
      persist(1); closeSheet(); render(true);
    });
    const un = $('#undate', el);
    if (un) un.addEventListener('click', () => { x.date = null; persist(1); closeSheet(); render(true); });

  });
}

// A divider on the Weekly tab or the Calendar: rename it, or take it off just this day (from the Calendar), this weekday, or all of them.
function dividerSheet(id, day) {
  const r = routineById(id); if (!r) return;
  const twins = routine.filter(x => x.divider && x.text === r.text && x.id !== id).length;
  openSheet(`${head('Divider')}<form class="form" id="f" autocomplete="off">
      <input class="field" type="text" data-k="text" value="${esc(r.text)}" autocapitalize="sentences" enterkeyhint="done" aria-label="Divider">
      <label class="lb">Every</label>${daySeg(r.dow)}
      <button type="submit" class="primary">Save</button>
    </form>
    <div class="actions">${day ? `<button type="button" class="item" id="delDay"><span class="l">Remove from this day only</span><span class="s">${esc(fmtDay(day))} · every other ${DOW[r.dow]} keeps it</span></button>` : ''}<button type="button" class="item danger" id="del"><span class="l">Delete</span><span class="s">From every ${DOW[r.dow]}</span></button>${twins ? `<button type="button" class="item danger" id="delAll"><span class="l">Delete from every day</span><span class="s">This one and the ${plural(twins, 'other', 'others')} like it</span></button>` : ''}</div>`, el => {
    const f = $('#f', el), dow = wireSeg(el, 'dow');
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = $('[data-k=text]', f).value.trim(); if (!v) return;
      Object.assign(r, { text: v, dow: +dow() });
      persist(1); closeSheet(); render(true);
    });
    const one = $('#delDay', el);   // the same note a ticked-off weekly item leaves: gone from that day, nowhere else
    if (one) one.addEventListener('click', () => { routineDone[`${id}|${day}`] = true; persist(1); closeSheet(); render(true); });
    arm($('#del', el), 'delete', () => { routine = routine.filter(t => t.id !== id); persist(1); closeSheet(); render(true); });
    const all = $('#delAll', el);
    if (all) arm(all, 'delete them all', () => { const text = r.text; routine = routine.filter(t => !(t.divider && t.text === text)); persist(1); closeSheet(); render(true); });
  });
}
function editRoutine(id) {

function sectionSheet(id) {

/* ================================================================== backup and restore */
const backupText = () => JSON.stringify({ app: APP, version: 2, saved: new Date().toISOString(), tasks, routine, monthly, sections, special, routineDone, days }, null, 1);
async function backup() {
  const how = await shareFile(BACKUP_NAME, backupText(), 'application/json');
  if (how === 'cancelled') return;
  meta.unsaved = 0; meta.lastBackup = new Date().toISOString(); LS.set(K.meta, meta);
  toast(how === 'shared' ? 'Backed up.' : `Saved ${BACKUP_NAME} to your downloads.`);
  closeSheet(); render(true);
}
async function restore(file) {
  let d = null;
  try { d = JSON.parse(await file.text()); } catch { /* not ours */ }
  if (!d || d.app !== APP || !Array.isArray(d.tasks)) { toast('That isn’t a To-Do backup.'); return; }
  openSheet(`${head('Replace everything?')}<p class="foot">The backup from ${esc(d.saved ? new Date(d.saved).toLocaleString() : 'an unknown time')} replaces what is in the app now: ${plural(d.tasks.length, 'item', 'items')}, ${plural(arr(d.routine).filter(r => !r.divider).length, 'weekly item', 'weekly items')}, ${plural(arr(d.monthly).length, 'monthly item', 'monthly items')}, ${plural(arr(d.special).length, 'yearly date', 'yearly dates')}.</p>
    <button type="button" class="item danger" id="go"><span class="l">Replace with the backup</span></button>
    <button type="button" class="item" data-close><span class="l">Keep what I have</span></button>`, el => {
    arm($('#go', el), 'replace', () => {
      tasks = arr(d.tasks); routine = arr(d.routine); monthly = arr(d.monthly); sections = arr(d.sections); special = arr(d.special); routineDone = d.routineDone && typeof d.routineDone === 'object' ? d.routineDone : {}; days = d.days && typeof d.days === 'object' ? d.days : {};
      persist(); closeSheet(); render(); toast('Restored.');
    });
  });
}
$('#pick').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) restore(f); });

function moreSheet() {
  const n = meta.unsaved || 0;
  const status = n ? `${plural(n, 'change', 'changes')} since ${meta.lastBackup ? 'your backup on ' + new Date(meta.lastBackup).toLocaleDateString() : 'you started'}` : meta.lastBackup ? `Up to date. Last backed up ${new Date(meta.lastBackup).toLocaleDateString()}` : 'Not backed up yet';
  openSheet(`${head(APP)}
    <button type="button" class="item" id="backup"><span class="l">Back up</span><span class="s">${esc(status)}. Saves one file to OneDrive.</span></button>
    <label class="item" for="pick"><span class="l">Restore from a backup</span><span class="s">Pick ${BACKUP_NAME} from OneDrive</span></label>
    <p class="about">Everything in ${APP} stays on this phone. Blue is personal, green is work. Weekly and monthly items show on the Calendar in grey italics; tick one and it goes for that day only. Drag anything by the lines at its end, or hold it anywhere; the drive dividers move too.</p>`, el => {
    $('#backup', el).addEventListener('click', backup);
  });
}

/* ================================================================== start */
document.addEventListener('touchstart', () => {}, { passive: true });   // iPhone Safari shows pressed states only once something listens for touches
document.addEventListener('focusout', () => setTimeout(() => { if (!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) window.scrollTo(0, 0); }, 60));
// Old ticks are forgotten after a season, so the phone never fills up.
{ const cutoff = addDays(today(), -120); let changed = false;
  for (const k of Object.keys(routineDone)) if (k.split('|')[1] < cutoff) { delete routineDone[k]; changed = true; }
  for (const d of Object.keys(days)) if (d < cutoff) { delete days[d]; changed = true; }
  const before = tasks.length; tasks = tasks.filter(x => !x.done); if (tasks.length !== before) changed = true;
  if (changed) persist(); }
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.tab === 'cal') render(true); });   // a new day gets a new Today
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
