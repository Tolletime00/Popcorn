<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movies</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Movies">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<!--
  Movies: a personal movie-rating app.
  One file on purpose: the styles and the script are below, and the typeface is embedded at the very end.
  Nothing secret lives in this file. The movie database key and the ratings are stored on the phone.
-->
<style>
/* ---------- tokens */
:root{
  --bg:#fff; --sheet:#fff; --ink:#000;
  --ink-2:rgba(0,0,0,.6); --ink-3:rgba(0,0,0,.36);
  --line:rgba(0,0,0,.1); --fill:rgba(0,0,0,.055);
  --gold:#ffc83d;
  --font:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  color-scheme:light dark;
}
.r1{--tint:#d2cec2}.r2{--tint:#d9cdae}.r3{--tint:#e4cc8e}.r4{--tint:#f1ca68}.r5{--tint:#ffc83d}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --sheet:#1c1c1e; --ink:#fff;
    --ink-2:rgba(255,255,255,.64); --ink-3:rgba(255,255,255,.4);
    --line:rgba(255,255,255,.16); --fill:rgba(255,255,255,.1);
  }
  .r1{--tint:#8f8b80}.r2{--tint:#a09476}.r3{--tint:#bba366}.r4{--tint:#dbb453}.r5{--tint:#ffc83d}
}

/* ---------- base */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--ink);
  font:400 17px/1.35 var(--font);letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit}
input{font:inherit;letter-spacing:inherit;color:inherit;-webkit-user-select:text;user-select:text}
a{color:inherit}
p,h1,h2,ol,ul{margin:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-top:env(safe-area-inset-top);max-width:520px;margin:0 auto}
#view{position:relative;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- toolbar */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
#tabs button{display:grid;justify-items:center;gap:2px;padding:8px 0 5px;font-size:11px;letter-spacing:.03em;color:var(--ink-3)}
#tabs svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tabs .f{fill:transparent;transition:fill .15s}
#tabs [aria-current=page]{color:var(--ink)}
#tabs [aria-current=page] .f{fill:var(--gold)}
#tabs svg.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.4)}}
body[data-view=movie] #tabs,body[data-view=install] #tabs{display:none}

/* ---------- shared pieces */
.poster{display:block;flex:none;object-fit:cover;background:var(--fill);border-radius:4px}
.p-s{width:44px;height:66px}
.p-m{width:56px;height:84px}
.p-l{width:76px;height:114px;border-radius:6px}
.poster.none{display:grid;place-items:center;font-weight:300;font-size:22px;color:var(--ink-3)}
.chip{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 4px;border-radius:15px;background:var(--tint,var(--fill));color:#000;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums lining-nums}

.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;width:100%}
.mrow .tx{display:grid;gap:2px}
.mrow .t{font-size:17px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.mrow .y{font-size:15px;color:var(--ink-2);font-variant-numeric:lining-nums}
.mrow .rt{display:grid;justify-items:center;gap:3px}
.mrow .w{font-size:12px;color:var(--ink-2)}

.field{position:relative}
.field input{display:block;width:100%;height:54px;margin:0;border:0;border-radius:27px;background:var(--fill);padding:0 22px 0 52px;font-size:18px;outline:none;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--ink-3)}
.field input:focus-visible{box-shadow:inset 0 0 0 1.5px var(--ink)}
.field svg{position:absolute;left:20px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--ink-3);pointer-events:none}
.field.plain input{padding-left:22px}
.field .clear{position:absolute;right:4px;top:50%;margin-top:-22px;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2)}
.field .clear svg{position:static;margin:0;width:16px;height:16px;color:inherit}

.primary{display:block;width:100%;height:54px;border-radius:27px;background:var(--gold);color:#000;font-size:18px;font-weight:500;text-align:center;transition:background .15s,color .15s}
.primary:disabled{background:var(--fill);color:var(--ink-3);cursor:default}
.primary:not(:disabled):active{filter:brightness(.94)}
.quiet{display:inline-block;padding:10px 4px;font-size:15px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.note{padding:40px 32px;text-align:center;color:var(--ink-2);font-size:17px;line-height:1.4}
.note .quiet{margin-top:8px}

.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;min-height:48px;padding:0 6px}
.bar h2{font-size:15px;font-weight:400;color:var(--ink-2);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{position:relative;min-width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:4px;background:var(--gold)}
.text-btn{height:44px;padding:0 14px;font-size:15px;color:var(--ink-2)}

/* ---------- home screens: Rate and Recommend */
.home{min-height:100%;display:grid;grid-template-rows:1fr auto 1fr;padding:0 24px}
.ask{grid-row:2;display:grid;gap:18px;justify-items:stretch}
.ask label,.ask .lead{font-size:28px;line-height:1.14;font-weight:300;letter-spacing:-.005em;text-align:center;text-wrap:balance}
.ask .help{font-size:15px;line-height:1.4;color:var(--ink-2);text-align:center;text-wrap:pretty}
.ask .help.bad{color:var(--ink)}
.ask .quiet{justify-self:center}
.last{grid-row:3;align-self:end;padding-bottom:18px}
.cap{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.nudge{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;margin-top:14px;padding:12px 0 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink-2)}
.nudge i{width:8px;height:8px;border-radius:4px;background:var(--gold)}
.nudge b{font-weight:500;color:var(--ink)}

/* ---------- search results and log lists */
.list{list-style:none;padding:2px 0 24px}
.list .mrow{padding:12px 20px}
.list .mrow:active{background:var(--fill)}
.list.tight{padding-bottom:6px}
.list.tight .mrow{padding:8px 20px;gap:14px}
.more-btn{display:block;margin:0 auto 28px}

.logbar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px;padding:10px 6px 8px 20px;background:var(--bg)}
.logbar .field input{height:44px;border-radius:22px;font-size:17px;padding-left:46px;padding-right:44px}
.logbar .field>svg{left:16px}
.sec{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.sec .nm{font-size:17px}
.sec .ct{margin-left:auto;font-size:13px;color:var(--ink-3);font-variant-numeric:lining-nums}
.found{padding:6px 20px 0;font-size:13px;color:var(--ink-2)}

/* ---------- Watchlist */
.watch{min-height:100%}
.watch .ask{padding:28px 24px 18px}
.watch .cap{padding:0 20px;margin-bottom:2px}
.mrow .ck{width:24px;height:24px;color:var(--ink-3)}
.mrow .ck svg{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- rating screen */
.rate{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.film{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;padding:2px 20px 16px}
.film h1{font-size:24px;line-height:1.15;font-weight:500;letter-spacing:-.005em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.film .y{margin-top:4px;font-size:17px;color:var(--ink-2);font-variant-numeric:lining-nums}
.film .was{margin-top:6px;font-size:13px;color:var(--ink-2)}

.scale{list-style:none;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;overscroll-behavior:contain;padding:6px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.scale li{flex:1 0 46px;max-height:70px;display:grid}
.scale button{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;column-gap:12px;width:100%;padding:0 8px;border-radius:14px}
.scale .n{display:grid;place-items:center;width:28px;height:28px;border-radius:14px;font-size:16px;color:var(--ink-3);font-variant-numeric:tabular-nums lining-nums;transition:background .12s,color .12s}
.scale .tx{display:grid;gap:1px;overflow:hidden}
.scale .nm{font-size:17px;line-height:1.2;color:var(--ink-2);transition:color .12s}
.scale .d{font-size:13px;line-height:1.25;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale .on .n{background:var(--tint);color:#000;font-weight:500}
.scale .on .nm{color:var(--ink);font-weight:500}
.scale .on .d{color:var(--ink-2)}

.dock{padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.readout{min-height:78px;text-align:center}
.readout .word{font-size:30px;line-height:1.1;font-weight:300;letter-spacing:-.005em}
.readout .desc{margin-top:5px;font-size:15px;line-height:1.3;color:var(--ink-2);text-wrap:balance}
.readout.idle .word{color:var(--ink-3)}

.slider{position:relative;height:52px;margin:2px 0 12px;touch-action:none;cursor:pointer;--p:.5}
.slider .track{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--fill);overflow:hidden}
.slider .fill{height:100%;width:calc(18px + (100% - 36px) * var(--p));background:var(--tint,transparent);transition:width .12s ease-out,background .12s}
.slider .ticks{position:absolute;left:18px;right:18px;top:50%;height:0;display:flex;justify-content:space-between;pointer-events:none}
.slider .ticks i{width:2px;height:2px;margin:-1px -1px 0;border-radius:1px;background:var(--ink-3)}
.slider .thumb{position:absolute;top:50%;left:calc((100% - 36px) * var(--p));width:36px;height:36px;margin-top:-18px;border-radius:18px;display:grid;place-items:center;background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink-3);font-size:16px;font-weight:500;color:#000;font-variant-numeric:tabular-nums lining-nums;transition:left .12s ease-out,background .12s;pointer-events:none}
.slider.set .thumb{background:var(--tint);box-shadow:0 0 0 3px var(--bg)}
.slider input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.slider:focus-within .thumb{outline:2px solid var(--ink);outline-offset:3px}

@media (max-height:700px){
  .film{padding-bottom:10px}
  .film .p-l{width:56px;height:84px}
  .film h1{font-size:21px}
  .scale{padding-top:2px;padding-bottom:2px}
  .scale li{flex-basis:42px}
  .readout{min-height:66px}
  .readout .word{font-size:24px}
  .slider{height:46px;margin-bottom:8px}
}

/* ---------- Recommend: ready to send */
.send{min-height:100%;display:grid;grid-template-rows:auto 1fr;}
.send .body{align-self:center;display:grid;gap:18px;padding:0 24px 40px}
.send .req{font-size:28px;line-height:1.14;font-weight:300;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.send .help{font-size:15px;line-height:1.4;color:var(--ink-2);text-align:center;text-wrap:pretty}
.send .alt{display:flex;justify-content:center;gap:18px}

/* ---------- add to Home Screen */
.install{min-height:100%;display:grid;align-content:center;gap:22px;padding:32px 28px}
.install img{width:84px;height:84px;border-radius:19px;justify-self:center}
.install h1{font-size:28px;line-height:1.14;font-weight:300;text-align:center;text-wrap:balance}
.install ol{display:grid;gap:10px;padding-left:24px;font-size:17px;line-height:1.35}
.install .help{font-size:15px;line-height:1.4;color:var(--ink-2)}
.install .quiet{justify-self:center}

/* ---------- sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);opacity:0;transition:opacity .22s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;max-height:88%;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:22px 22px 0 0;padding:6px 0 calc(14px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.open>.scrim{opacity:1}
.open>.sheet{transform:none}
.sheet .head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:6px 10px 2px 24px}
.sheet .head h2{font-size:21px;font-weight:500}
.item{display:grid;gap:1px;width:100%;padding:13px 24px;cursor:pointer}
.item:active{background:var(--fill)}
.item .l{font-size:17px}
.item .s{font-size:13px;color:var(--ink-2)}
.sheet .form{display:grid;gap:14px;padding:10px 24px 8px}
.sheet .form .help{font-size:15px;line-height:1.4;color:var(--ink-2)}
.sheet .form .help.bad{color:var(--ink)}
.about{margin-top:8px;padding:16px 24px 4px;border-top:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--ink-2)}
.progress{padding:22px 24px 26px;font-size:17px;text-align:center}
.progress .s{margin-top:6px;font-size:13px;color:var(--ink-2)}

/* ---------- toast */
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:40;width:max-content;max-width:calc(100% - 48px);padding:10px 18px;border-radius:21px;background:var(--ink);color:var(--bg);font-size:15px;line-height:1.3;text-align:center;opacity:0;transform:translate(-50%,-10px);transition:opacity .2s,transform .2s;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- the one piece of show: a rating pops, then drops into the log */
#pop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);pointer-events:none;opacity:0;transition:opacity .16s,background-color .3s}
#pop.on{opacity:1}
#pop.clear{background:transparent}
#pop .c{position:relative;display:grid;justify-items:center;gap:20px;transition:transform .42s cubic-bezier(.5,0,.75,.4),opacity .42s ease-in}
#pop .disc{position:relative;z-index:1;width:172px;height:172px;border-radius:86px;display:grid;place-items:center;background:var(--tint);color:#000;font-size:100px;line-height:1;font-weight:300;font-variant-numeric:lining-nums;animation:pop-in .55s cubic-bezier(.2,1.7,.35,1) both}
#pop .word{font-size:28px;font-weight:300;animation:word-in .3s .22s ease-out both;transition:opacity .15s}
#pop .k{position:absolute;left:50%;top:86px;width:14px;height:14px;margin:-7px;border-radius:7px;background:var(--tint);animation:kernel .62s .08s cubic-bezier(.15,.7,.3,1) both}
#pop .k:nth-child(odd){width:9px;height:9px;margin:-4.5px;background:var(--ink-3)}
#pop.fly .c{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0}
#pop.fly .word{opacity:0}
@keyframes pop-in{from{transform:scale(.08)}}
@keyframes word-in{from{opacity:0;transform:translateY(8px)}}
@keyframes kernel{from{transform:rotate(var(--a)) translateY(-60px) scale(1);opacity:1}to{transform:rotate(var(--a)) translateY(-158px) scale(.5);opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  #pop .k{display:none}
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections">
    <button type="button" data-tab="rate"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M13 3.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L13 18.4l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg><span>Rate</span></button>
    <button type="button" data-tab="log"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M13 7.2C11.2 5.9 8.6 5.3 4.6 5.3v14c4 0 6.6.6 8.4 1.9 1.8-1.3 4.4-1.9 8.4-1.9v-14c-4 0-6.6.6-8.4 1.9z"/><path d="M13 7.2v14"/></svg><span>Log</span></button>
    <button type="button" data-tab="watch"><svg viewBox="0 0 26 26" aria-hidden="true"><rect class="f" x="4" y="4" width="18" height="18" rx="4.5"/><path d="M8.6 13.3l3 3 6-6.6"/></svg><span>Watchlist</span></button>
    <button type="button" data-tab="rec"><svg viewBox="0 0 26 26" aria-hidden="true"><circle class="f" cx="7.6" cy="7.3" r="2.7"/><circle class="f" cx="13.8" cy="7.7" r="2.3"/><rect class="f" x="3.8" y="11.2" width="12.4" height="9.6" rx="2"/><path class="f" d="M16.2 14.6l5.6-2.7v8.2l-5.6-2.7z"/></svg><span>Recommend</span></button>
  </nav>
</div>
<div id="sheets"></div>
<div id="pop" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="said" class="sr" role="status" aria-live="polite"></div>
<input id="pick" class="sr" type="file" accept=".csv,text/csv,text/comma-separated-values,text/plain" multiple tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

/* ================================================================== the scale
   Names and descriptions are the owner's own. Index = rating. */
const SCALE = [
  null,
  ['Bad', 'Stop early. Unwatchable.'],
  ['Meh', 'Waste of time. Checking phone.'],
  ['Good', 'Worth streaming. Entertaining.'],
  ['Great', 'Worth renting. Memorable.'],
  ['Perfect', 'Worth owning. Personal favorites.'],
];
const MAX = SCALE.length - 1;   // 5

const APP = 'Movies';
const API = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p';
const CSV_NAME = 'Movie Ratings.csv';
const WATCH_NAME = 'Watchlist.csv';
const GUIDE_NAME = 'Movies - how to get it back.txt';

/* ================================================================== helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const wait = ms => new Promise(r => setTimeout(r, ms));
const reRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const collator = new Intl.Collator('en', { sensitivity: 'base', numeric: true });
const sortKey = t => fold(t).replace(/^(the|a|an)\s+/, '');
const dayFmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const niceDay = iso => { const d = new Date(iso); return isNaN(d) ? '' : dayFmt.format(d); };
const localDay = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };

const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>',

};

/* ================================================================== storage
   Everything personal stays in this browser's storage on the phone. */
const K = { ratings: 'popcorn.ratings', watch: 'popcorn.watchlist', key: 'popcorn.tmdbKey', meta: 'popcorn.meta', skip: 'popcorn.skipInstall' };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
let ratings = LS.get(K.ratings, []);
if (!Array.isArray(ratings)) ratings = [];
let meta = Object.assign({ unsaved: 0, lastBackup: null }, LS.get(K.meta, {}));
let watch = LS.get(K.watch, []);   // movies to watch, newest first
if (!Array.isArray(watch)) watch = [];
const getKey = () => LS.get(K.key, '') || '';
if (ratings.some(r => r.rating > MAX)) {   // rated with the old 1-to-10 version of the app
  for (const r of ratings) r.rating = Math.min(MAX, Math.max(1, Math.ceil(r.rating / 2)));
  LS.set(K.ratings, ratings); meta.unsaved = (meta.unsaved || 0) + 1; LS.set(K.meta, meta);
}

function persist(changes = 0) {
  if (!LS.set(K.ratings, ratings)) toast('Couldn’t save on this phone. Its storage may be full.');
  if (changes) { meta.unsaved = (meta.unsaved || 0) + changes; LS.set(K.meta, meta); }
}
function persistWatch(changes = 0) {
  if (!LS.set(K.watch, watch)) toast('Couldn’t save on this phone. Its storage may be full.');
  if (changes) { meta.unsaved = (meta.unsaved || 0) + changes; LS.set(K.meta, meta); }
}
const byId = id => ratings.find(r => r.id === id);
const onWatch = id => watch.some(w => w.id === id);
const latest = () => ratings.reduce((a, r) => (!a || (r.at || '') > (a.at || '') ? r : a), null);
const sorted = list => [...list].sort((a, b) => b.rating - a.rating || collator.compare(sortKey(a.title), sortKey(b.title)) || (a.year || 0) - (b.year || 0));

/* ================================================================== the movie database (TMDB) */
class Problem extends Error { constructor(kind) { super(kind); this.kind = kind; } }

async function tmdb(path, params = {}, key = getKey()) {
  const url = new URL(API + path);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const init = {};
  if (key.split('.').length === 3) init.headers = { Authorization: 'Bearer ' + key };  // the long "Read Access Token"
  else url.searchParams.set('api_key', key);                                           // the short "API Key"
  let res;
  try { res = await fetch(url, init); } catch { throw new Problem('offline'); }
  if (res.status === 401) throw new Problem('key');
  if (res.status === 404) throw new Problem('missing');
  if (!res.ok) throw new Problem('tmdb');
  return res.json();
}

const yearOf = d => { const y = String(d || '').slice(0, 4); return /^\d{4}$/.test(y) ? +y : null; };
const slim = m => ({ id: m.id, title: m.title || m.original_title || 'Untitled', year: yearOf(m.release_date), poster: m.poster_path || null });

// Closest title match first; the database's own order breaks ties.
function rank(results, q) {
  const f = sortKey(q).trim();
  const score = m => {
    const t = sortKey(m.title || ''), o = sortKey(m.original_title || '');
    if (fold(m.title || '') === fold(q).trim()) return 0;      // letter for letter
    if (t === f || o === f) return 1;                           // the same apart from a leading The, A or An
    if (t.startsWith(f)) return 2;
    if (new RegExp('(^|[^a-z0-9])' + reRe(f)).test(t)) return 3;
    return 4;
  };
  return results.map((m, i) => ({ m, i, s: score(m) })).sort((a, b) => a.s - b.s || a.i - b.i).map(x => x.m);
}

async function fetchDetails(id) {
  const d = await tmdb(`/movie/${id}`, { append_to_response: 'credits', language: 'en-US' });
  const crew = (d.credits && d.credits.crew) || [], cast = (d.credits && d.credits.cast) || [];
  return {
    ...slim(d),
    genres: (d.genres || []).map(g => g.name),
    directors: [...new Set(crew.filter(c => c.job === 'Director').map(c => c.name))],
    cast: [...cast].sort((a, b) => (a.order ?? 99) - (b.order ?? 99)).slice(0, 12).map(c => c.name),
  };
}

function applyDetails(id, d) {
  const r = byId(id);
  if (!r || !d) return;
  Object.assign(r, { title: d.title, year: d.year ?? r.year, poster: d.poster ?? r.poster, genres: d.genres, directors: d.directors, cast: d.cast, full: true });
  persist();
}

// Fill in genre, director and cast for anything saved without them (rated offline, or just restored).
let backfilling = false;
async function backfill() {
  if (backfilling || !getKey()) return;
  backfilling = true;
  let filled = 0;
  try {
    for (const r of ratings.filter(x => !x.full)) {
      try { applyDetails(r.id, await fetchDetails(r.id)); filled++; }
      catch (e) { if (e.kind === 'missing') { r.full = true; persist(); } else break; }
    }
    for (const w of watch.filter(x => !x.full)) {
      try { const d = await fetchDetails(w.id); Object.assign(w, { title: d.title, year: d.year ?? w.year, poster: d.poster ?? w.poster, full: true }); persistWatch(); filled++; }
      catch (e) { if (e.kind === 'missing') { w.full = true; persistWatch(); } else break; }
    }
  } finally { backfilling = false; }
  // show the new posters, unless that would interrupt typing or an open sheet
  const busy = sheets.classList.contains('open') || /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if (filled && !busy && ['rate', 'log', 'watch'].includes(document.body.dataset.view)) { top().scroll = viewEl.scrollTop; render(); }
}

/* ================================================================== posters */
function poster(path, title, size) {
  const cls = { s: 'p-s', m: 'p-m', l: 'p-l' }[size];
  const letter = esc((sortKey(title || '').match(/[a-z0-9]/) || ['?'])[0].toUpperCase());
  if (!path) return `<span class="poster none ${cls}" aria-hidden="true">${letter}</span>`;
  const w = size === 'l' ? 'w342' : 'w185';
  return `<img class="poster ${cls}" src="${IMG}/${w}${esc(path)}" alt="" loading="lazy" decoding="async" data-letter="${letter}">`;
}
document.addEventListener('error', e => {
  const el = e.target;
  if (!(el instanceof HTMLImageElement) || !el.classList.contains('poster')) return;
  const s = document.createElement('span');
  s.className = el.className + ' none'; s.setAttribute('aria-hidden', 'true'); s.textContent = el.dataset.letter || '';
  el.replaceWith(s);
}, true);

function rowHTML(m, { size = 'm', word = false } = {}) {
  const r = m.rating;
  return `<button type="button" class="mrow" data-id="${esc(m.id)}">
    ${poster(m.poster, m.title, size)}
    <span class="tx"><span class="t">${esc(m.title)}</span>${m.year ? `<span class="y">${esc(m.year)}</span>` : ''}</span>
    ${r ? `<span class="rt r${r}"><span class="chip">${r}</span>${word ? `<span class="w">${esc(SCALE[r][0])}</span>` : ''}</span>` : m.onList ? `<span class="ck" title="On your watchlist">${ICON.check}</span>` : ''}
  </button>`;
}

/* ================================================================== navigation
   Three tab homes plus a small stack of pages on top. Pages use browser history so the
   iPhone back-swipe works. */
const viewEl = $('#view');
const homes = { rate: { name: 'rate' }, log: { name: 'log', q: '' }, watch: { name: 'watch' }, rec: { name: 'rec' } };
const state = { tab: 'rate', stack: [] };
const top = () => state.stack[state.stack.length - 1] || homes[state.tab];

function go(page) {
  top().scroll = viewEl.scrollTop;
  state.stack.push(page);
  history.pushState({ d: state.stack.length }, '');
  render();
}
function back() { if (state.stack.length) history.back(); }
function goHome(tab) {
  const d = state.stack.length;
  state.stack = [];
  if (tab) state.tab = tab;
  if (d) history.go(-d);
  render();
}
window.addEventListener('popstate', e => {
  const d = (e.state && e.state.d) || 0;
  if (d < state.stack.length) { state.stack.length = d; closeSheet(true); render(); }
});

const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const needsInstall = () => isIOS() && !standalone() && !LS.get(K.skip, false);

function render() {
  const page = top();
  const name = needsInstall() ? 'install' : page.name;
  document.body.dataset.view = name;
  for (const b of $$('#tabs button')) {
    if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
  VIEWS[name](page);
  viewEl.scrollTop = page.scroll || 0;
}

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  if (b.dataset.tab === state.tab && !state.stack.length) { viewEl.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  homes[b.dataset.tab].scroll = 0;
  goHome(b.dataset.tab);
});

/* ================================================================== small UI services */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

const sheets = $('#sheets');
let sheetTurn = 0;   // guards against a sheet that is closed before it has finished opening
function openSheet(html, mount) {
  const turn = ++sheetTurn;
  sheets.classList.remove('open');
  sheets.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  $('.scrim', sheets).addEventListener('click', () => closeSheet());
  if (mount) mount($('.sheet', sheets));
  requestAnimationFrame(() => requestAnimationFrame(() => { if (turn === sheetTurn) sheets.classList.add('open'); }));
}
function closeSheet(now) {
  if (!sheets.firstChild) return;
  const turn = ++sheetTurn;
  sheets.classList.remove('open');
  if (now) sheets.innerHTML = ''; else setTimeout(() => { if (turn === sheetTurn) sheets.innerHTML = ''; }, 320);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}

// Hands files to the iPhone share sheet (Save to Files, then OneDrive). Falls back to plain downloads.
async function shareFiles(list) {
  const files = list.map(f => new File([f.text], f.name, { type: f.type }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  for (const [i, file] of files.entries()) {
    if (i) await wait(300);   // browsers drop a second download that follows too quickly
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  return 'downloaded';
}
const shareFile = (name, text, type) => shareFiles([{ name, text, type }]);

/* ================================================================== backup and restore */
function csvOf(header, rows) {
  const cell = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '\ufeff' + [header, ...rows].map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}
const toCSV = () => csvOf(['Title', 'Year', `Rating (1-${MAX})`, 'Date Rated', 'TMDB ID'], sorted(ratings).map(r => [r.title, r.year ?? '', r.rating, localDay(r.at), r.id]));
const watchCSV = () => csvOf(['Title', 'Year', 'Date Added', 'TMDB ID'], watch.map(w => [w.title, w.year ?? '', localDay(w.added), w.id]));

async function backup() {
  const files = [];
  if (ratings.length) files.push({ name: CSV_NAME, text: toCSV(), type: 'text/csv' });
  if (watch.length) files.push({ name: WATCH_NAME, text: watchCSV(), type: 'text/csv' });
  if (!files.length) { toast('Nothing to back up yet.'); return; }
  const how = await shareFiles(files);
  if (how === 'cancelled') return;
  meta.unsaved = 0; meta.lastBackup = new Date().toISOString(); LS.set(K.meta, meta);
  toast(how === 'shared' ? 'Backed up.' : `Saved ${files.map(f => f.name).join(' and ')} to your downloads.`);
  closeSheet(); render();
}

function parseCSV(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else quoted = false; }
      else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

// Reads a ratings spreadsheet or a watchlist spreadsheet; the header says which it is.
function readBackup(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { kind: 'ratings', rows: [] };
  const head = rows[0].map(h => fold(h).replace(/[^a-z0-9]/g, ''));
  const col = names => head.findIndex(h => names.includes(h));
  let iT = col(['title', 'movie', 'name', 'film']), iY = col(['year', 'releaseyear']), iR = col([`rating1${MAX}`, 'rating', 'score', 'myrating']);
  let iD = col(['daterated', 'dateadded', 'date', 'rated', 'added']), iI = col(['tmdbid', 'id']);
  const tagged = iR >= 0 && head[iR] === `rating1${MAX}`;   // written by this version of the app
  const headed = iT >= 0 && (iR >= 0 || iD >= 0 || iI >= 0 || iY >= 0);
  let body = rows.slice(1);
  if (!headed) { iT = 0; iY = 1; iR = 2; iD = 3; iI = 4; body = rows; }   // no header row: assume our own ratings columns
  const kind = headed && iR < 0 ? 'watch' : 'ratings';
  const out = [];
  for (const r of body) {
    const title = String(r[iT] ?? '').trim();
    if (!title) continue;
    const rating = kind === 'ratings' ? Math.round(Number(String(r[iR] ?? '').trim())) : null;
    if (kind === 'ratings' && !(rating >= 1 && rating <= (tagged ? MAX : 10))) continue;
    const id = iI >= 0 ? parseInt(r[iI], 10) : NaN;
    const day = iD >= 0 ? String(r[iD] ?? '').trim() : '';
    const when = /^\d{4}-\d{2}-\d{2}$/.test(day) ? new Date(day + 'T12:00:00') : new Date(day);
    out.push({ id: Number.isFinite(id) && id > 0 ? id : null, title, year: yearOf(String(r[iY] ?? '').trim()), rating, at: isNaN(when) ? null : when.toISOString() });
  }
  // A backup from the old 1-to-10 version of the app: fold it onto this scale.
  if (kind === 'ratings' && !tagged && out.some(r => r.rating > MAX)) for (const r of out) r.rating = oldToNew(r.rating);
  return { kind, rows: out };
}
const oldToNew = r => Math.min(MAX, Math.max(1, Math.ceil(r / 2)));

async function restore(fileList) {
  const jobs = [];
  for (const f of fileList) { let b = null; try { b = readBackup(await f.text()); } catch { /* unreadable */ } if (b && b.rows.length) jobs.push(b); }
  if (!jobs.length) { toast(fileList.length > 1 ? 'Those files have no ratings or watchlist in them.' : 'That file has no ratings or watchlist in it.'); return; }
  const total = jobs.reduce((n, j) => n + j.rows.length, 0);
  openSheet(`<div class="progress"><p id="rp">Restoring ${plural(total, 'movie', 'movies')}…</p><p class="s">Keep ${APP} open until this finishes.</p></div>`);
  const rp = () => $('#rp');
  let done = 0, added = 0, addedW = 0, missed = 0, offline = false;
  const stamp = Date.now();
  for (const job of jobs) for (const row of job.rows) {
    let d = null, id = row.id;
    if (!offline) {
      try {
        if (!id) {   // a hand-made spreadsheet with no IDs: look the title up
          const q = { query: row.title, include_adult: 'false', language: 'en-US', page: '1' };
          if (row.year) q.primary_release_year = String(row.year);
          const hit = rank((await tmdb('/search/movie', q)).results || [], row.title)[0];
          id = hit ? hit.id : null;
        }
        if (id) d = await fetchDetails(id);
      } catch (e) { if (e.kind === 'offline' || e.kind === 'key') offline = true; }
    }
    done++;
    if (!id) { missed++; }
    else if (job.kind === 'watch') {
      const old = watch.find(w => w.id === id);
      const rec = { id, title: (d && d.title) || row.title, year: (d && d.year) ?? row.year ?? null, poster: (d && d.poster) ?? (old && old.poster) ?? null,
        added: row.at || (old && old.added) || new Date(stamp - done * 1000).toISOString(), full: !!d || !!(old && old.full) };
      if (old) Object.assign(old, rec); else watch.push(rec);
      addedW++;
    } else {
      const old = byId(id);
      const rec = { id, title: (d && d.title) || row.title, year: (d && d.year) ?? row.year, poster: (d && d.poster) ?? (old && old.poster) ?? null,
        rating: row.rating, at: row.at || (old && old.at) || new Date(stamp - done * 1000).toISOString(),
        genres: d ? d.genres : (old && old.genres) || [], directors: d ? d.directors : (old && old.directors) || [], cast: d ? d.cast : (old && old.cast) || [], full: !!d || !!(old && old.full) };
      if (old) Object.assign(old, rec); else ratings.push(rec);
      added++;
    }
    if (rp()) rp().textContent = `Restoring ${done} of ${total}…`;
    if (done % 20 === 0) { persist(); persistWatch(); }
  }
  watch.sort((a, b) => (b.added || '').localeCompare(a.added || ''));
  persist(); persistWatch();
  closeSheet(); render();
  const parts = [];
  if (added) parts.push(plural(added, 'rating', 'ratings'));
  if (addedW) parts.push(`${plural(addedW, 'movie', 'movies')} to watch`);
  toast(`Restored ${parts.join(' and ') || 'nothing'}.` + (missed ? ` ${plural(missed, 'row', 'rows')} couldn’t be matched.` : '') + (offline ? ' Posters will fill in when you’re online.' : ''));
  if (offline) backfill();
}
$('#pick').addEventListener('change', e => { const fs = [...(e.target.files || [])]; e.target.value = ''; if (fs.length) restore(fs); });

function guideText() {
  const url = location.origin + location.pathname;
  return [
    `${APP}: how to get it back on a new phone`,
    '',
    `The app lives at this address, so there is nothing to rebuild:`,
    url,
    '',
    '1. Open that address in Safari on the new iPhone.',
    '2. Tap Share, then Add to Home Screen. Keep "Open as Web App" on and tap Add.',

    '4. Paste your movie database key. It is on themoviedb.org under Settings, then API (the one called API Key).',
    `5. In ${APP}, go to Log, tap the three dots, then "Restore from a backup" and pick "${CSV_NAME}" (and "${WATCH_NAME}", if you saved one) from OneDrive.`,
    '',

  ].join('\r\n');
}

/* ================================================================== recommendations
   Builds the request for Claude: what the owner wants plus everything already seen. */
function recPrompt(q) {
  const lines = [];
  for (let r = MAX; r >= 1; r--) {
    const g = sorted(ratings.filter(x => x.rating === r));
    if (g.length) lines.push(`${r} (${SCALE[r][0]}): ` + g.map(m => m.title + (m.year ? ` (${m.year})` : '')).join('; '));
  }
  const plain = d => d.replace(/\.\s*$/, '').replace(/\.\s+/g, ', ').toLowerCase();
  const scale = SCALE.slice(1).map((s, i) => `${i + 1} ${s[0]} (${plain(s[1])})`).reverse().join('; ');
  return [
    `Recommend 5 to 10 movies for this request: "${q}"`,
    '',
    'Rules:',
    '- Only movies I have not seen. Every movie in my ratings below is one I have seen, so leave those out.',
    `- Use my ratings to judge my taste. My scale, best to worst: ${scale}.`,
    '- Search the web when it helps, for example for recent releases or award winners.',
    '- Best match first. For each movie give the title, the year, and a sentence or two on why it fits this request and my taste.',
    '',
    lines.length ? `My ratings (${plural(ratings.length, 'movie', 'movies')}):` : 'I have not rated any movies yet.',
    ...lines,
    ...(watch.length ? ['', 'On my watchlist, not seen yet (fine to recommend if they fit): ' + watch.map(w => w.title + (w.year ? ` (${w.year})` : '')).join('; ')] : []),
  ].join('\n');
}

/* ================================================================== the pop */
async function playPop(rating) {
  const el = $('#pop');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const kernels = Array.from({ length: 10 }, (_, i) => `<i class="k" style="--a:${i * 36 + 12}deg"></i>`).join('');
  el.className = `r${rating}`;
  el.innerHTML = `<div class="c">${kernels}<div class="disc">${rating}</div><div class="word">${esc(SCALE[rating][0])}</div></div>`;
  void el.offsetWidth;
  el.classList.add('on');
  await wait(still ? 900 : 820);
  const target = $('#tabs [data-tab=log] svg'), disc = $('.disc', el);
  if (target && disc && !still) {
    const a = disc.getBoundingClientRect(), b = target.getBoundingClientRect();
    el.style.setProperty('--tx', `${b.left + b.width / 2 - (a.left + a.width / 2)}px`);
    el.style.setProperty('--ty', `${b.top + b.height / 2 - (a.top + a.height / 2)}px`);
    $('.c', el).style.transformOrigin = '50% 86px';
    el.classList.add('fly', 'clear');
    await wait(400);
    target.classList.remove('bump'); void target.offsetWidth; target.classList.add('bump');
  }
  el.classList.remove('on');
  await wait(180);
  el.className = ''; el.innerHTML = '';
}

/* ---------------- watchlist */
function addToWatch(m) {
  if (onWatch(m.id)) { toast(`${m.title} is already on your watchlist.`); return; }
  watch.unshift({ id: m.id, title: m.title, year: m.year ?? null, poster: m.poster ?? null, added: new Date().toISOString(), full: true });
  persistWatch(1);
  homes.watch.scroll = 0;
  goHome('watch');
  toast(`Added ${m.title} to your watchlist.`);
}

/* ---------------- log search: title, genre, year, director, actor or rating */
const ALIASES = { 'sci-fi': 'science fiction', scifi: 'science fiction', 'rom-com': 'romance comedy', romcom: 'romance comedy', doc: 'documentary', docs: 'documentary', kids: 'family' };
function matches(r, query) {
  let q = fold(query);
  for (const [k, v] of Object.entries(ALIASES)) q = q.replace(new RegExp('(^|\\s)' + reRe(k) + '(?=\\s|$)', 'g'), '$1' + v);
  const hay = fold([r.title, SCALE[r.rating][0], ...(r.genres || []), ...(r.directors || []), ...(r.cast || [])].join(' | '));
  const title = fold(r.title);
  return q.split(/\s+/).filter(Boolean).every(t => {
    let m;
    if ((m = t.match(/^(\d)\+$/)) && +m[1] >= 1 && +m[1] <= MAX) return r.rating >= +m[1];
    if ((m = t.match(/^(\d)-(\d)$/)) && +m[1] >= 1 && +m[2] <= MAX) return r.rating >= +m[1] && r.rating <= +m[2];
    if ((m = t.match(/^(\d{4})s$/))) return r.year != null && r.year >= +m[1] && r.year <= +m[1] + 9;
    if (/^\d+$/.test(t)) {
      if (+t >= 1 && +t <= MAX && r.rating === +t) return true;
      if (t.length === 4 && String(r.year) === t) return true;
      return new RegExp('(^|[^0-9])' + t + '([^0-9]|$)').test(title);
    }
    return hay.includes(t);
  });
}

function wireKeyForm(form, input, done) {
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const key = input.value.trim().replace(/^Bearer\s+/i, '');
    const help = $('[data-help]', form), btn = $('button[type=submit]', form);
    const say = (msg, bad) => { help.textContent = msg; help.classList.toggle('bad', !!bad); };
    if (!key) { say('Paste the key first.', true); return; }
    btn.disabled = true; const label = btn.textContent; btn.textContent = 'Checking…';

      say(err.kind === 'key' ? 'The movie database didn’t accept that key. Copy the API Key again and paste all of it.'

      if (b.hasAttribute('data-close')) return closeSheet();
      const what = b.dataset.do;
      if (what === 'backup') return backup();
      if (what === 'restore') {   // the label itself opens the file picker
        if (!getKey()) { e.preventDefault(); toast('Add your movie database key first.'); keySheet(); }

      }
