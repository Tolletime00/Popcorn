# Keeps the Football app's data fresh: scores, spreads and EPA, every half hour.
# Runs on GitHub's computers for free (this is a public repository) and commits only when something changed.
name: Football data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data.json
        run: python3 football/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "football-data"
          git config user.email "football-data@users.noreply.github.com"
          git add football/data football/logos
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "Football data $(date -u +'%Y-%m-%d %H:%M UTC')" && git push; fi
